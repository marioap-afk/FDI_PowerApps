n            'En revisión?': true,\r\n            'Estado de revisión': {Value: \"Pendiente\"}\r\n        }\r\n    );\r\n\r\n\r\n    Reset(ArchivoRevisiónComboBox);\r\n    Reset(ComentariosRevisiónText);\r\n    If(\r\n    IsBlank(CotizacionesGallery.Selected.FolderPath),\r\n    Clear(colDocsCotizaciones),\r\n    ClearCollect(\r\n        colDocsCotizaciones,\r\n        Filter('Carpeta cotizaciones',StartsWith('Folder path',CotizacionesGallery.Selected.FolderPath))\r\n    )\r\n);\r\n    Notify(\"Enviado a revisión\", NotificationType.Success);\r\n    Set(varMostrarRevisiónPopUp,false)\r\n)\n)"
