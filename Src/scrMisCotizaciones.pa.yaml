Screens:
  scrMisCotizaciones:
    Properties:
      Fill: =ColorValue(varTheme.FondoHex)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =ResetForm(CotizacionesForm);
        ViewForm(CotizacionesForm);
        UpdateContext({newMode: false, editMode: false, isItemSelected: false, deleteMode: false});

        Reset(CotizacionesGallery);
        Reset(SearchInput);
        Reset(VendedorFiltroComboBox);
        Reset(EstadoFiltroComboBox);
        Reset(TabsCotizacionesGallery);

        Set(varMostrarPopup2,false);
        Set(varMostrarAgregarArchivoPopUp,false);
        Set(varMostrarAsignarPopUp,false);
        Set(varMostrarRevisiónPopUp,false);
        Set(varMostrarAñadirEvidenciaPopUp,false);
        Set(varTabsCots,true);
        Set(varTabSelect,"Resumen");
        Set(varEstadoSolicitudesForm,"View");

        If(
            IsEmpty(colTabsGalleryCotizaciones),
            ClearCollect(
                colTabsGalleryCotizaciones,
                {Tab : "Resumen"},
                {Tab : "Revisiones"},
                {Tab : "Solicitudes"},
                {Tab : "Archivos"},
                {Tab : "Bitácora"},
                {Tab : "FDI"},
                {Tab : "Costos"}
            )
        );

        If(
            IsEmpty(colCotizacionEstadoColores),
            ClearCollect(
                colCotizacionEstadoColores,
                {EstadoNombre: "Sin asignar", Fondo: RGBA(254, 249, 195, 1), Barra: RGBA(234, 179, 8, 1)},
                {EstadoNombre: "En proceso", Fondo: RGBA(219, 234, 254, 1), Barra: RGBA(59, 130, 246, 1)},
                {EstadoNombre: "En espera de información", Fondo: RGBA(253, 230, 138, 1), Barra: RGBA(217, 119, 6, 1)},
                {EstadoNombre: "En revisión por parte de vendedor", Fondo: RGBA(253, 230, 138, 1), Barra: RGBA(217, 119, 6, 1)},
                {EstadoNombre: "Corrección requerida", Fondo: RGBA(254, 226, 226, 1), Barra: RGBA(220, 38, 38, 1)},
                {EstadoNombre: "Comprada", Fondo: RGBA(187, 247, 208, 1), Barra: RGBA(22, 163, 74, 1)},
                {EstadoNombre: "Enviada a cliente", Fondo: RGBA(220, 252, 231, 1), Barra: RGBA(74, 222, 128, 1)},
                {EstadoNombre: "Lista para enviar", Fondo: RGBA(191, 219, 254, 1), Barra: RGBA(37, 99, 235, 1)}
            )
        );

        Clear(colDocsCotizaciones)
    Children:
      - cntPrincipal:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - cmpEncabezadoMisCotizaciones:
                Control: CanvasComponent
                ComponentName: cmpEncabezado
                Properties:
                  Height: =68
                  Width: =Parent.Width
            - BodyContainer1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =If(scrMisCotizaciones.Size = ScreenSize.Small, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =If(scrMisCotizaciones.Size = ScreenSize.Small, 10, 16)
                  PaddingBottom: =2
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - SidebarContainer1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =If(scrMisCotizaciones.Size = ScreenSize.Small, 0, 2)
                        Height: =If(scrMisCotizaciones.Size = ScreenSize.Small, Min(360, Parent.Height * 0.45), Parent.Height)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinWidth: =0
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        Width: =If(scrMisCotizaciones.Size = ScreenSize.Small, Parent.Width, 320)
                      Children:
                        - SearchInput:
                            Control: TextInput@0.0.54
                            Properties:
                              AccessibleLabel: ="Search Input"
                              Align: =Align.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =16
                              Placeholder: ="Search"
                              TriggerOutput: =TriggerOutput.Delayed
                              X: =40
                              Y: =40
                        - VendedorFiltroComboBox:
                            Control: ComboBox@0.0.51
                            Properties:
                              AccessibleLabel: ="Vendedor Filtro Combo Box"
