                                                LayoutMinWidth: =16
                                                OnSelect: "=\r\n// 1) Bitácora: Solicitud de información creada\r\nPatch(\r\n    'Bitácora cotizaciones',\r\n    Defaults('Bitácora cotizaciones'),\r\n    {\r\n        FolioLookUp: { Id: CotizacionesGallery.Selected.ID, Value: CotizacionesGallery.Selected.Folio},\r\n        Evento: {Value: \"Solicitud resuelta\"},\r\n        'Solicitud ID': SolicitudesForm.LastSubmit.ID,\r\n        Creado: Now(),\r\n        UsuarioSnapShot: User().FullName,\r\n        Usuario: {\r\n            '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser\",\r\n            Claims: \"i:0#.f|membership|\" & Lower(User().Email),\r\n            DisplayName: User().FullName,\r\n            Email: User().Email,\r\n            Department: \"\",\r\n            JobTitle: \"\",\r\n            Picture: \"\"\r\n        },\r\n        'Estado anterior': {Value: CotizacionesGallery.Selected.Estado.Value},\r\n        'Estado nuevo': {Value: CotizacionesGallery.Selected.Estado.Value}\r\n    }\r\n);\r\n\r\n// 2 Cambiar estado de lla solicitud\r\nPatch(\r\n    'Solicitudes en cotizaciones',\r\n    SolicitudesGallery.Selected,\r\n    {\r\n        'Estado de solicitud': {Value : \"Resuelta\"},\r\n        'Fecha resuelta': Now()\r\n    }\r\n        \r\n);\r\n\r\nNotify(\"Solicitud marcada como resuelta.\", NotificationType.Success)"
                                                Text: ="Marcar como resuelta"
                                                Visible: =SolicitudesGallery.Selected.'Estado de solicitud'.Value = "Información subida"
                                          - CancelarSolicitudButton:
                                              Control: Button@0.0.45
                                              Properties:
                                                AccessibleLabel: ="Cancelar Solicitud Button"
                                                Appearance: ='ButtonCanvas.Appearance'.Secondary
                                                OnSelect: |-
