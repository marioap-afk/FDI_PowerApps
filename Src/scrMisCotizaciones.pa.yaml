                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="Attachments"
                                    FieldName: ="{Attachments}"
                                    FieldType: ="r*"
                                    Order: =4
                        - EstadoFiltroComboBox:
                            Control: ComboBox@0.0.51
                            Properties:
                              AccessibleLabel: ="Estado Filtro Combo Box"
                              AlignInContainer: =AlignInContainer.Stretch
                              Appearance: ='ComboboxCanvas.Appearance'.FilledDarker
                              InputTextPlaceholder: ="Buscar por estado"
                              Items: "=Choices([@'Cotizaciones 2026'].Estado)\r\n "
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              SelectMultiple: =true
                              X: =40
                              Y: =40
                            Children:
                              - Value1:
                                  Control: ComboBoxDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="Value"
                                    FieldName: ="Value"
                                    FieldType: ="s"
                                    Order: =29
                        - CotizacionesGallery:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextVariant_ver5.0
                            Properties:
                              AccessibleLabel: ="Cotizaciones Gallery"
                              BorderColor: =RGBA(245, 245, 245, 1)
                              Default: =Blank()
                              Items: |-
                                =With(
                                    {
                                        q: Trim(SearchInput.Value),
                                        puedeVerTodo: Coalesce(varPuedeVerTodoFDI, false),
                                        fechaMin: DateAdd(Today(), -18, TimeUnit.Months),
                                        vendedorIdActual: If(IsBlank(varVendedorActualFDI), Blank(), varVendedorActualFDI.ID),
                                        vendedoresSel: VendedorFiltroComboBox.SelectedItems,
                                        estadosSel: EstadoFiltroComboBox.SelectedItems
                                    },
                                    With(
                                        {
                                            baseRol: If(
                                                puedeVerTodo,
                                                Filter(
                                                    'Cotizaciones 2026',
                                                    Created >= fechaMin &&
                                                    (
                                                        Estado.Value = "Sin asignar" ||
                                                        Estado.Value = "En proceso" ||
                                                        Estado.Value = "En espera de información" ||
                                                        Estado.Value = "En revisión por parte de vendedor" ||
                                                        Estado.Value = "Corrección requerida" ||
                                                        Estado.Value = "Comprada" ||
                                                        Estado.Value = "Enviada a cliente" ||
                                                        Estado.Value = "Lista para enviar"
                                                    )
                                                ),
                                                Filter(
                                                    'Cotizaciones 2026',
                                                    Created >= fechaMin &&
                                                    (
                                                        Estado.Value = "Sin asignar" ||
                                                        Estado.Value = "En proceso" ||
                                                        Estado.Value = "En espera de información" ||
                                                        Estado.Value = "En revisión por parte de vendedor" ||
                                                        Estado.Value = "Corrección requerida" ||
                                                        Estado.Value = "Comprada" ||
                                                        Estado.Value = "Enviada a cliente" ||
                                                        Estado.Value = "Lista para enviar"
                                                    ) &&
                                                    VendedoresLookUp.Id = vendedorIdActual
                                                )
                                            )
                                        },
                                        With(
                                            {
                                                baseVendedor: If(
                                                    !puedeVerTodo || IsEmpty(vendedoresSel),
                                                    baseRol,
                                                    If(
                                                        CountRows(vendedoresSel) = 1,
                                                        Filter(baseRol, VendedoresLookUp.Id = First(vendedoresSel).ID),
                                                        Filter(baseRol, VendedoresLookUp.Id in vendedoresSel.ID)
                                                    )
                                                )
                                            },
                                            With(
                                                {
                                                    baseEstado: If(
                                                        IsEmpty(estadosSel),
                                                        baseVendedor,
                                                        If(
                                                            CountRows(estadosSel) = 1,
                                                            Filter(baseVendedor, Estado.Value = First(estadosSel).Value),
                                                            Filter(baseVendedor, Estado.Value in estadosSel.Value)
                                                        )
                                                    )
                                                },
                                                If(
                                                    IsBlank(q),
                                                    baseEstado,
                                                    Filter(
                                                        baseEstado,
                                                        StartsWith(Title, q)
                                                            || StartsWith(EmpresaLookUp.Value, q)
                                                            || StartsWith(Folio, q)
                                                            || StartsWith(VendedoresLookUp.Value, q)
                                                            || StartsWith(ContactoLookUp.Value, q)
                                                            || StartsWith(AsignadoSnapShot, q)
                                                            || StartsWith('Dirección de la empresa', q)
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                              LayoutMinWidth: |
                                =100
                              OnSelect: |-
                                =If(
                                    IsBlank(ThisItem.FolderPath),
                                    Clear(colDocsCotizaciones),
                                    ClearCollect(
                                        colDocsCotizaciones,
                                        Filter(
                                            'Carpeta cotizaciones',
                                            StartsWith('Folder path', ThisItem.FolderPath)
                                        )
                                    )
                                );
                                Set(varEstadoSolicitudesForm, "View");
                                ViewForm(SolicitudesForm)
                              TabIndex: =0
                              TemplateFill: |-
                                =Coalesce(
                                    LookUp(colCotizacionEstadoColores, EstadoNombre = ThisItem.Estado.Value, Fondo),
                                    RGBA(243, 244, 246, 1)
                                )
                              X: =40
                              Y: =40
                            Children:
                              - Title3:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =RGBA(50, 49, 48, 1)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                                    Height: =Self.Size * 1.8
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =12
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =ThisItem.Folio
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.TemplateWidth - 86
