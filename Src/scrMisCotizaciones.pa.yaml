                              LayoutMinWidth: =16
                              SelectMultiple: =true
                              Visible: =Coalesce(varPuedeVerTodoFDI, false)
                              X: =40
                              Y: =40
                            Children:
                              - Title2:
                                  Control: ComboBoxDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="Title"
                                    FieldName: ="Title"
                                    FieldType: ="s"
                                    Order: =1
                              - Vendedor1:
                                  Control: ComboBoxDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="Vendedor"
                                    FieldName: ="Vendedor"
                                    FieldType: ="E"
                                    Order: =2
                              - Activo1:
                                  Control: ComboBoxDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="Activo"
                                    FieldName: ="Activo"
                                    FieldType: ="b"
                                    Order: =3
