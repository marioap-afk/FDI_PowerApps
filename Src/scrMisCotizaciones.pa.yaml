                                          Y: =40
                                    - CalcularKPIButton:
                                        Control: Button@0.0.45
                                        Properties:
                                          AccessibleLabel: ="Calcular KPIButton"
                                          Appearance: ='ButtonCanvas.Appearance'.Transparent
                                          FillPortions: =1
                                          Icon: ="Clock"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =ClearCollect(
                                                colBit,
                                                SortByColumns(
                                                    Filter('Bitácora cotizaciones',
                                                        FolioLookUp.Value = CotizacionesGallery.Selected.Folio
                                                ),
                                                    "Creado",
                                                    SortOrder.Ascending
                                                )
                                            );

                                            // ===============================
                                            // PASO 2) Construir segmentos crudos (colSegRaw)
                                            // Cada evento genera un tramo: [Creado_i -> Creado_{i+1}] con estado = EstadoNuevo_i
                                            // El último tramo queda abierto hasta Now()
                                            // ===============================
                                            Clear(colSegRaw);

                                            If(
                                                CountRows(colBit) = 0,
                                                Blank(),

                                                If(
                                                    CountRows(colBit) = 1,
                                                    ClearCollect(
                                                        colSegRaw,
                                                        {
                                                            Inicio: First(colBit).Creado,
                                                            Fin: Now(),
                                                            Estado: First(colBit).'Estado nuevo'.Value,
                                                            DurMin: DateDiff(First(colBit).Creado, Now(), TimeUnit.Minutes)
                                                        }
                                                    ),

                                                    ClearCollect(
                                                        colSegRaw,
                                                        ForAll(
                                                            Sequence(CountRows(colBit) - 1),
                                                            With(
                                                                {
                                                                    r1: Index(colBit, Value),
                                                                    r2: Index(colBit, Value + 1)
                                                                },
                                                                {
                                                                    Inicio: r1.Creado,
                                                                    Fin: r2.Creado,
                                                                    Estado: r1.'Estado nuevo'.Value,
                                                                    DurMin: DateDiff(r1.Creado, r2.Creado, TimeUnit.Minutes)
                                                                }
                                                            )
                                                        )
                                                    );

                                                    // Último tramo abierto (del último evento a Now())
                                                    Collect(
                                                        colSegRaw,
                                                        With(
                                                            { rLast: Last(colBit) },
                                                            {
                                                                Inicio: rLast.Creado,
                                                                Fin: Now(),
                                                                Estado: rLast.'Estado nuevo'.Value,
                                                                DurMin: DateDiff(rLast.Creado, Now(), TimeUnit.Minutes)
                                                            }
                                                        )
                                                    )
                                                )
                                            );


                                            // ===============================
                                            // PASO 3) Ventana del ciclo operativo y recorte (colSegOper)
                                            // ===============================
                                            Set(varT0, First(colBit).Creado);

                                            Set(
                                                varTEnviada,
                                                With(
                                                    { r: Last(Filter(colBit, 'Estado nuevo'.Value = "Enviada a cliente")) },
                                                    If(IsBlank(r), Blank(), r.Creado)
                                                )
                                            );

                                            Set(varTFinOper, If(IsBlank(varTEnviada), Now(), varTEnviada));


                                            // 3.1) Base: IniEff / FinEff
                                            ClearCollect(
                                                colSegOperBase,
                                                Filter(
                                                    AddColumns(
                                                        colSegRaw,
                                                        IniEff,
                                                            If(Inicio < varT0, varT0, Inicio),
                                                        FinEff,
                                                            If(Fin > varTFinOper, varTFinOper, Fin)
                                                    ),
                                                    FinEff > IniEff
                                                )
                                            );

                                            // 3.2) Final: DurEffMin
                                            ClearCollect(
                                                colSegOper,
                                                AddColumns(
                                                    colSegOperBase,
                                                    DurEffMin,
                                                        Max(0, DateDiff(IniEff, FinEff, TimeUnit.Minutes))
                                                )
                                            );

                                            //Lead time operativo (Tiempo total)
                                            Set(varLeadOperMin, DateDiff(varT0, varTFinOper, TimeUnit.Minutes));

                                            //Tiempo de asignación
                                            Set(
                                                varTtaMin,
                                                Sum(
                                                    Filter(colSegOper, Estado = "Sin asignar"),
                                                    DurEffMin
                                                )
                                            );

                                            //Tiempo en ingeniería
                                            Set(
                                                varIngMin,
                                                Sum(
                                                    Filter(colSegOper, Estado = "En proceso"),
                                                    DurEffMin
                                                )
                                            );

                                            //Tiempo en revisión
                                            Set(
                                                varRevMin,
                                                Sum(
                                                    Filter(colSegOper, Estado = "En revisión por parte de vendedor"),
                                                    DurEffMin
                                                )
                                            );

                                            //Tiempo lista para enviar
                                            Set(
                                                varListaMin,
                                                Sum(
                                                    Filter(colSegOper, Estado = "Lista para enviar"),
                                                    DurEffMin
                                                )
                                            );

                                            //Tiempo en espera por vendedor
                                            Set(
                                                varBloqVentasMin,
                                                Sum(
                                                    Filter(colSegOper, Estado = "En espera de información"),
                                                    DurEffMin
                                                )
                                            );

                                            //Tiempo en espera por externos
                                            Set(
                                                varBloqExtMin,
                                                Sum(
                                                    Filter(colSegOper, Estado = "En espera info cliente" || Estado = "En espera info proveedor"),
                                                    DurEffMin
                                                )
                                            );
                                          Text: ="Calcular KPIs"
                                          Visible: =varTabSelect = "Bitácora"
