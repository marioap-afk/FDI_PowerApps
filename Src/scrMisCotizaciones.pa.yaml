                              Align: =Align.Center
                              BasePaletteColor: =RGBA(5, 102, 178, 1)
                              BorderRadius: =6
                              FontSize: =14
                              Height: =48
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: "=If(\r\n    IsEmpty(AñadirEvidenciaComboBox.SelectedItems),\r\n    Notify(\"Selecciona al menos un archivo para anexar.\", NotificationType.Error),\r\n    \r\n    With(\r\n        { \r\n            Cot: CotizacionesGallery.Selected,\r\n            Rec: CountRows(Filter(colDocsCotizaciones, 'Estado de revisión'.Value = \"Rechazado\")) \r\n        },\r\n\r\n        //Pacth de estado a cotización\r\n        Patch(\r\n        'Cotizaciones 2026',\r\n        Cot,\r\n        {\r\n            Estado: {Value: If(Rec = 0, \"En revisión por parte de vendedor\", \"En proceso\")},\r\n            'Estado desde': Now()\r\n        }\r\n        );\r\n\r\n        ForAll(\r\n            AñadirEvidenciaComboBox.SelectedItems,\r\n\r\n            // 1) Registrar en bitácora (un evento por archivo)\r\n            Patch(\r\n                'Bitácora cotizaciones',\r\n                Defaults('Bitácora cotizaciones'),\r\n                {\r\n                    FolioLookUp: {Id: Cot.ID, Value: Cot.Folio},\r\n                    Evento: {Value: \"Evidencia anexada a revisión\"},\r\n                    'Estado anterior': {Value: CotizacionesGallery.Selected.Estado.Value},\r\n                    'Estado nuevo': {Value: If(Rec = 0, \"En revisión por parte de vendedor\", \"En proceso\")},\r\n                    Creado: Now(),\r\n                    UsuarioSnapShot: User().FullName,\r\n                    Usuario: {\r\n                        '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser\",\r\n                        Claims: \"i:0#.f|membership|\" & Lower(User().Email),\r\n                        DisplayName: User().FullName,\r\n                        Email: User().Email,\r\n                        Department:\"\", JobTitle:\"\", Picture:\"\"\r\n                    },\r\n                    Evidencia: ThisRecord.'Link to item',\r\n                    Comentario:\r\n                        \"Evidencia: \" & ThisRecord.Name &\r\n                        If(\r\n                            !IsBlank(ComentariosAñadirEvidenciaText.Value),\r\n                            \" | \" & ComentariosAñadirEvidenciaText.Value,\r\n                            \"\"\r\n                        )\r\n                }\r\n            );\r\n\r\n            // 2) Marcar el archivo como parte de revisión en la biblioteca\r\n            Patch(\r\n                'Carpeta cotizaciones',\r\n                ThisRecord,\r\n                {\r\n                    'En revisión?': true,\r\n                    'Estado de revisión': {Value: \"Pendiente\"}\r\n                }\r\n            )\r\n        );\r\n\r\n        Reset(AñadirEvidenciaComboBox);\r\n        Reset(ComentariosAñadirEvidenciaText);\r\n\r\n        If(\r\n    IsBlank(CotizacionesGallery.Selected.FolderPath),\r\n    Clear(colDocsCotizaciones),\r\n    ClearCollect(\r\n        colDocsCotizaciones,\r\n        Filter('Carpeta cotizaciones',StartsWith('Folder path',CotizacionesGallery.Selected.FolderPath))\r\n    )\r\n);\r\n\r\n        Set(varMostrarAñadirEvidenciaPopUp,false);\r\n        Notify(\"Evidencia anexada.\", NotificationType.Success)\r\n    )\r\n)"
