                                                        Department:"", JobTitle:"", Picture:""
                                                    },
                                                    'Revisado cuando': Now(),
                                                    'Aprobado para versión': If(AccionRevisionTxt = "Aprobar", varDocRevision.Versión, Blank())
                                                }
                                            );

                                            If(
                                                IsBlank(Cot.FolderPath),
                                                Clear(colDocsCotizaciones),
                                                ClearCollect(
                                                    colDocsCotizaciones,
                                                    Filter('Carpeta cotizaciones', StartsWith('Folder path', Cot.FolderPath))
                                                )
                                            );

                                            With(
                                                {
                                                    EstadoNuevoTxt: If(
                                                        AccionRevisionTxt = "Aprobar",
                                                        If(
                                                            CountRows(Filter(colDocsCotizaciones, 'Estado de revisión'.Value = "Rechazado")) > 0,
                                                            "En proceso",
                                                            If(
                                                                CountRows(Filter(colDocsCotizaciones, 'Estado de revisión'.Value = "Pendiente")) > 0,
                                                                "En revisión por parte de vendedor",
                                                                "Lista para enviar"
                                                            )
                                                        ),
                                                        "En proceso"
                                                    )
                                                },
                                                IfError(
                                                    Patch(
                                                        'Cotizaciones 2026',
                                                        Cot,
                                                        {
                                                            Estado: {Value: EstadoNuevoTxt},
                                                            'Estado desde': If(EstadoAnteriorTxt = EstadoNuevoTxt, Cot.'Estado desde', Now())
                                                        }
                                                    );

                                                    If(
                                                        EstadoAnteriorTxt <> EstadoNuevoTxt,
                                                        Patch(
                                                            'Bitácora cotizaciones',
                                                            Defaults('Bitácora cotizaciones'),
                                                            {
                                                                FolioLookUp: {Id: Cot.ID, Value: Cot.Folio},
                                                                Evento: {Value: If(AccionRevisionTxt = "Aprobar", "Documento aprobado", "Corrección requerida")},
                                                                'Estado anterior': {Value: EstadoAnteriorTxt},
                                                                'Estado nuevo': {Value: EstadoNuevoTxt},
                                                                Creado: Now(),
                                                                UsuarioSnapShot: User().FullName,
                                                                Usuario: {
                                                                    '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                                                    Claims: "i:0#.f|membership|" & Lower(User().Email),
                                                                    DisplayName: User().FullName,
                                                                    Email: User().Email,
                                                                    Department:"", JobTitle:"", Picture:""
                                                                },
                                                                Evidencia: varDocRevision.'Link to item',
                                                                Comentario: varDocRevision.Name & If(!IsBlank(ComentarioRevisionTxt), " | " & ComentarioRevisionTxt, "")
                                                            }
                                                        )
                                                    );

                                                    UpdateContext({varMostrarComentarioRevisiónPopUp:false});
                                                    Reset(txtComentarioRevision);
                                                    Set(varDocRevision, Blank());
                                                    Set(varAccionRevision, Blank());
                                                    Notify("Documento " & If(AccionRevisionTxt = "Aprobar", "aprobado", "rechazado") & ".", NotificationType.Success),

                                                    Notify("Error al actualizar la cotización: " & Coalesce(FirstError.Message, "intenta nuevamente."), NotificationType.Error)
                                                )
                                            ),

                                            Notify("Error al guardar revisión: " & Coalesce(FirstError.Message, "intenta nuevamente."), NotificationType.Error)
                                        )
                                    )
                                );
                              Text: ="Confirmar"
