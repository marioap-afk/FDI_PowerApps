                                    - SolicitudesForm:
                                        Control: Form@2.4.4
                                        Layout: Vertical
                                        Properties:
                                          BorderColor: =RGBA(245, 245, 245, 1)
                                          DataSource: ='Solicitudes en cotizaciones'
                                          DefaultMode: |
                                            =FormMode.View
                                          Item: =SolicitudesGallery.Selected
                                          LayoutMaxHeight: =300
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          NumberOfColumns: =1
                                          OnSuccess: "=If(\r\n    varEstadoSolicitudesForm = \"New\",\r\n    //En caso de que sea un item nuevo\r\n    // 1) Bitácora: Solicitud de información creada\r\n    Patch(\r\n        'Bitácora cotizaciones',\r\n        Defaults('Bitácora cotizaciones'),\r\n        {\r\n            FolioLookUp: { Id: CotizacionesGallery.Selected.ID, Value: CotizacionesGallery.Selected.Folio},\r\n            Evento: {Value: \"Solicitud de información creada\"},\r\n            'Solicitud ID': SolicitudesForm.LastSubmit.ID,\r\n            Creado: Now(),\r\n            UsuarioSnapShot: User().FullName,\r\n            Usuario: {\r\n                '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser\",\r\n                Claims: \"i:0#.f|membership|\" & Lower(User().Email),\r\n                DisplayName: User().FullName,\r\n                Email: User().Email,\r\n                Department: \"\",\r\n                JobTitle: \"\",\r\n                Picture: \"\"\r\n            },\r\n            'Estado anterior': {Value: CotizacionesGallery.Selected.Estado.Value},\r\n            'Estado nuevo': {Value: \"En espera de información\"},\r\n            Comentario: SolicitudesForm.LastSubmit.'Comentario solicitante'\r\n        }\r\n    );\r\n\r\n    // 2 Cambiar estado de la cotización\r\n    Patch(\r\n        'Cotizaciones 2026',\r\n        CotizacionesGallery.Selected,\r\n        {\r\n            Estado: {Value: \"En espera de información\"},\r\n            'Estado desde': Now()\r\n        }\r\n        \r\n    ),\r\n\r\n    //En caso de que sea un item existente (Subida de información)\r\n    //Verificar el estado buscando si hay solicitudes pendientes o aceptadas\r\n    With(\r\n        {\r\n            Bloqueo: Filter(\r\n                'Solicitudes en cotizaciones',\r\n                FolioLookUp.Id = CotizacionesGallery.Selected.ID And\r\n                ('Estado de solicitud'.Value = \"Pendiente\" || 'Estado de solicitud'.Value = \"Aceptada\")\r\n            )\r\n        },\r\n        With(\r\n            {\r\n                HayBloqueo: CountRows(Bloqueo) > 0,\r\n                EstadoNuevo: If(\r\n                    CountRows(Bloqueo) > 0,\r\n                    \"En espera de información\",\r\n                    \"En proceso\"\r\n                )\r\n            },\r\n\r\n            // 1) Bitácora: Solicitud de información creada\r\n            Patch(\r\n                'Bitácora cotizaciones',\r\n                Defaults('Bitácora cotizaciones'),\r\n                {\r\n                    FolioLookUp: { Id: CotizacionesGallery.Selected.ID, Value: CotizacionesGallery.Selected.Folio},\r\n                    Evento: {Value: \"Información subida\"},\r\n                    'Solicitud ID': SolicitudesForm.LastSubmit.ID,\r\n                    Creado: Now(),\r\n                    UsuarioSnapShot: User().FullName,\r\n                    Usuario: {\r\n                        '@odata.type': \"#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser\",\r\n                        Claims: \"i:0#.f|membership|\" & Lower(User().Email),\r\n                        DisplayName: User().FullName,\r\n                        Email: User().Email,\r\n                        Department: \"\",\r\n                        JobTitle: \"\",\r\n                        Picture: \"\"\r\n                    },\r\n                    'Estado anterior': {Value: CotizacionesGallery.Selected.Estado.Value},\r\n                    'Estado nuevo': {Value: If(HayBloqueo, CotizacionesGallery.Selected.Estado.Value, EstadoNuevo)},\r\n                    Comentario: SolicitudesForm.LastSubmit.'Comentario solicitante'\r\n                }\r\n            );\r\n\r\n            //2) Cambiar estado de cotización\r\n            If(\r\n                !HayBloqueo,\r\n                Patch(\r\n                    'Cotizaciones 2026',\r\n                    CotizacionesGallery.Selected,\r\n                    {\r\n                        Estado: {Value:EstadoNuevo},\r\n                        'Estado desde': Now()\r\n                    }\r\n                )\r\n            );\r\n        )\r\n    )\r\n\r\n);\r\n\r\nSet(varEstadoSolicitudesForm, \"View\");\r\nViewForm(SolicitudesForm)"
