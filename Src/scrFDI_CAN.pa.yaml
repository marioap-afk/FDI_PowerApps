Screens:
  scrFDI_CAN:
    Properties:
      Fill: =ColorValue(varTheme.FondoHex)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varVista, "Sistemas");
        If(
            IsBlank(locTabSel) && CountRows(Filter(colTabs, TipoKey = "CAN")) > 0,
            UpdateContext({locTabSel: First(Filter(colTabs, TipoKey = "CAN"))})
        );
        Set(varDraftActual, LookUp(colCAN_Draft, SistemaId = locTabSel.SistemaId))
    Children:
      - cntFDISistemaCAN:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =ColorValue(varTheme.FondoHex)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(scrFDI_CAN.Size = ScreenSize.Small, 8, 16)
            PaddingLeft: =If(scrFDI_CAN.Size = ScreenSize.Small, 8, 16)
            PaddingRight: =If(scrFDI_CAN.Size = ScreenSize.Small, 8, 16)
            PaddingTop: =If(scrFDI_CAN.Size = ScreenSize.Small, 8, 16)
            Width: =Parent.Width
          Children:
            - cntFDISistemaBarCAN:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                  BorderThickness: =1
                  DropShadow: =varTheme.Sombra
                  Fill: =ColorValue(varTheme.SuperficieHex)
                  RadiusBottomLeft: =varTheme.CardRadius
                  RadiusBottomRight: =varTheme.CardRadius
                  RadiusTopLeft: =varTheme.CardRadius
                  RadiusTopRight: =varTheme.CardRadius
                  FillPortions: =0
                  Height: =If(scrFDI_CAN.Size = ScreenSize.Small, 52, 60)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =44
                  LayoutMinWidth: =0
                  PaddingBottom: =6
                  PaddingLeft: =If(scrFDI_CAN.Size = ScreenSize.Small, 8, 12)
                  PaddingRight: =If(scrFDI_CAN.Size = ScreenSize.Small, 8, 12)
                  PaddingTop: =6
                Children:
                  - icoFDISistemaVolverCAN:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Volver"
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =ColorValue(varTheme.PrimarioHex)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Height: =If(scrFDI_CAN.Size = ScreenSize.Small, 36, 40)
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(16, 110, 190, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.BackArrow
                        OnSelect: |-
                          =Set(varFDIRetornarSistemas, true);
                          Navigate(scrFDI, ScreenTransition.None, {locTabSel: locTabSel})
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(16, 110, 190, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        TabIndex: =0
                        Tooltip: ="Volver"
                        Width: =If(scrFDI_CAN.Size = ScreenSize.Small, 36, 40)
                  - lblFDISistemaTituloCAN:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =ColorValue(varTheme.TextoHex)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height - 12
                        LayoutMinWidth: =0
                        Size: =If(scrFDI_CAN.Size = ScreenSize.Small, varTheme.Label, varTheme.H3)
                        Text: =Coalesce(locTabSel.NombreSistema, "Cantiléver")
                        Width: =Max(0, Parent.Width - icoFDISistemaVolverCAN.Width - 24)
                        Wrap: =false
            - cntCAN:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  Visible: =CountRows(colTabs) > 0 && Coalesce(locTabSel.TipoKey, "") = "CAN"
                  Width: =Parent.Width
                  X: =40
                  Y: =40
                Children:
                  - cmpCarddrpTipoCotización_CAN:
                      Control: CanvasComponent
                      ComponentName: cmpCarddrp
                      Properties:
                        DefaultSelectedItem: |-
                          =With(
                              {_valor: varDraftActual.MetodoCaptura},
                              If(
                                  IsBlank(_valor),
                                  Blank(),
                                  LookUp(cmpCarddrpTipoCotización_CAN.Items, Value = _valor)
                              )
                          )
                        Height: =60
                        Items: |-
                          =Table(
                              {Value: "Diseño"},
                              {Value: "Listado de piezas"},
                              {Value: "Planos/diseño de cliente"},
                              {Value: "Cotización o pedido anterior"}
                          )
                        OnChange: |-
                          =Patch(
                              colCAN_Draft,
                              LookUp(colCAN_Draft, SistemaId = locTabSel.SistemaId),
                              {
                                  MetodoCaptura: Self.Selected.Value,
                                  TipoDiseño: Self.Selected.Value
                              }
                          )
                        Título: ="Método de captura"
                  - cntListadoDePiezasCAN:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                        BorderThickness: =1
                        DropShadow: =varTheme.Sombra
                        Fill: =ColorValue(varTheme.SuperficieHex)
                        RadiusBottomLeft: =varTheme.CardRadius
                        RadiusBottomRight: =varTheme.CardRadius
                        RadiusTopLeft: =varTheme.CardRadius
                        RadiusTopRight: =varTheme.CardRadius
                        FillPortions: =0
                        Height: =cntListadoDePiezasBotonesCAN.Height+cntListadoDePiezasHeaderCAN.Height+galListadoDePiezasCAN.Height+32
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Visible: =cmpCarddrpTipoCotización_CAN.Selected.Value = "Listado de piezas"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =40
                      Children:
                        - cntListadoDePiezasBotonesCAN:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =2
                              PaddingRight: =2
                            Children:
                              - lblListadoDePiezasCAN:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =16
                                    TabIndex: =0
                                    Text: ="Listado de piezas"
                                    Width: =Parent.Width - btnAgregarPiezaCAN.Width - 24
                              - btnAgregarPiezaCAN:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="btn Agregar Pieza CAN"
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Height: =36
                                    Icon: ="Add"
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =Collect(
                                          colListadoPiezas,
                                          {
                                              RowId: GUID(),
                                              SistemaId: locTabSel.SistemaId,
                                              Pieza: "",
                                              Comentarios: ""
                                          }
                                      );
                                    Text: ="Agregar"
                                    Width: =120
                        - cntListadoDePiezasHeaderCAN:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorValue(varTheme.BordeHex)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue(varTheme.HeaderTablaHex)
                              FillPortions: =0
                              Height: =varTheme.HeaderHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                            Children:
                              - lblPiezaHeaderCAN:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Pieza"
                                    Width: =Max(260, Min(420, Parent.Width * 0.32))
                              - lblComentarioHeaderCAN:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Comentario"
                                    Width: =Max(360, Parent.Width - lblPiezaHeaderCAN.Width - lblAccionHeaderCAN.Width - 64)
                              - lblAccionHeaderCAN:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Acción"
                                    Width: =64
                        - galListadoDePiezasCAN:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextVariant_ver5.0
                            Properties:
                              AccessibleLabel: ="gal Listado De Piezas CAN"
                              BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                              BorderThickness: =1
                              FillPortions: =0
                              Height: =If(CountRows(Self.AllItems)=0,0,Min(galListadoDePiezasCAN.TemplateHeight*CountRows(Self.AllItems),420))
                              Items: |-
                                =Filter(
                                    colListadoPiezas,
                                    SistemaId = locTabSel.SistemaId
                                )
                              LayoutMinHeight: =16
                              Selectable: =false
                              TabIndex: =0
                              TemplateSize: =varTheme.RowHeight
                            Children:
                              - BorrarPiezaButton_CAN:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Borrar Pieza Button"
                                    Align: =Align.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    Height: =36
                                    Icon: ="Delete"
                                    OnSelect: =Remove(colListadoPiezas, ThisItem)
                                    Text: =""
                                    Width: =44
                                    X: =Parent.TemplateWidth - Self.Width - 16
                                    Y: =12
                              - ComentarioInput_CAN:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Comentario Input"
                                    BorderColor: =ColorValue(varTheme.BordeHex)
                                    BorderThickness: =1
                                    Color: =ColorValue(varTheme.TextoHex)
                                    Default: =ThisItem.Pieza
                                    DelayOutput: =true
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    HoverBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    HoverColor: =ColorValue(varTheme.TextoHex)
                                    HoverFill: =ColorValue(varTheme.SuperficieHex)
                                    OnChange: |-
                                      =Patch(
                                          colListadoPiezas,
                                          ThisItem,
                                          {
                                              Pieza: Self.Text
                                          }
                                      )
                                    PressedBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    PressedColor: =ColorValue(varTheme.TextoHex)
                                    PressedFill: =ColorValue(varTheme.SuperficieHex)
                                    RadiusBottomLeft: =varTheme.ControlRadius
                                    RadiusBottomRight: =varTheme.ControlRadius
                                    RadiusTopLeft: =varTheme.ControlRadius
                                    RadiusTopRight: =varTheme.ControlRadius
                                    Width: =Max(260, Min(420, Parent.TemplateWidth * 0.32))
                                    X: =16
                                    Y: =12
                              - PiezaInput_CAN:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Pieza Input"
                                    BorderColor: =ColorValue(varTheme.BordeHex)
                                    BorderThickness: =1
                                    Color: =ColorValue(varTheme.TextoHex)
                                    Default: =ThisItem.Comentarios
                                    DelayOutput: =true
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    HoverBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    HoverColor: =ColorValue(varTheme.TextoHex)
                                    HoverFill: =ColorValue(varTheme.SuperficieHex)
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =Patch(
                                          colListadoPiezas,
                                          ThisItem,
                                          {
                                              Comentarios: Self.Text
                                          }
                                      )
                                    PressedBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    PressedColor: =ColorValue(varTheme.TextoHex)
                                    PressedFill: =ColorValue(varTheme.SuperficieHex)
                                    RadiusBottomLeft: =varTheme.ControlRadius
                                    RadiusBottomRight: =varTheme.ControlRadius
                                    RadiusTopLeft: =varTheme.ControlRadius
                                    RadiusTopRight: =varTheme.ControlRadius
                                    Width: =Max(360, Parent.TemplateWidth - ComentarioInput_CAN.Width - BorrarPiezaButton_CAN.Width - 64)
                                    X: =ComentarioInput_CAN.X + ComentarioInput_CAN.Width + 16
                                    Y: =12
                              - ComentarioLabel_CAN:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =ColorValue(varTheme.TextoSuaveHex)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: ="Comentario"
                                    Visible: =false
                                    Width: =PiezaInput_CAN.Width
                                    X: =PiezaInput_CAN.X
                                    Y: =8
                              - PiezaLabel_CAN:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =ColorValue(varTheme.TextoSuaveHex)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: ="Pieza"
                                    Visible: =false
                                    Width: =ComentarioInput_CAN.Width
                                    X: =ComentarioInput_CAN.X
                                    Y: =8
                              - Separator2_CAN:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(237, 235, 233, 1)
                                    Height: =1
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - Self.Height
                  - cntDiseñoCAN:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: |-
                          =If(
                              cmpCarddrpTipoCotización_CAN.Selected.Value = "Planos/diseño de cliente",
                              cntSectionCargaProductoCAN.Height +
                              cmpTxtTipoProductoCAN.Height +
                              cmpTxtLongitudCargaCAN.Height +
                              cmpTxtSeccionCargaCAN.Height +
                              cmpTxtPesoCargaCAN.Height +
                              cmpTxtCantidadPorNivelCAN.Height +
                              32,
                              Max(
                                  560,
                                  cntSectionCargaProductoCAN.Height +
                                  cmpTxtTipoProductoCAN.Height +
                                  cmpTxtLongitudCargaCAN.Height +
                                  cmpTxtSeccionCargaCAN.Height +
                                  cmpTxtPesoCargaCAN.Height +
                                  cmpTxtCantidadPorNivelCAN.Height +
                                  cntSectionConfigRackCAN.Height +
                                  cmpCarddrpGondolaCAN.Height +
                                  cntSectionAreaPasillosCAN.Height +
                                  cmpTxtPasilloMaxCAN.Height +
                                  cmpTxtPasilloMinCAN.Height +
                                  cmpTxtAnchoDispCAN.Height +
                                  cmpTxtLargoDispCAN.Height +
                                  cntSectionCriteriosNivelesCAN.Height +
                                  cmpCardTglAlturaMontacargasCAN.Height +
                                  If(cmpTxtAlturaMaxMontacargasCAN.Visible, cmpTxtAlturaMaxMontacargasCAN.Height, 0) +
                                  cmpCardTglAlturaNaveCAN.Height +
                                  If(cmpTxtAlturaMaxNaveCAN.Visible, cmpTxtAlturaMaxNaveCAN.Height, 0) +
                                  If(cmpTxtAlturaMinNaveCAN.Visible, cmpTxtAlturaMinNaveCAN.Height, 0) +
                                  cmpCardTglAdjuntarImagenLayoutCAN.Height +
                                  If(lblAdjuntarArchivosCAN.Visible, lblAdjuntarArchivosCAN.Height, 0) +
                                  cmpCardTglDefClienteCAN.Height +
                                  If(cmpTxtComentariosConfigClienteCAN.Visible, cmpTxtComentariosConfigClienteCAN.Height, 0) +
                                  cntSectionSeguridadCAN.Height +
                                  cmpCardTglElementosSeguridadCAN.Height +
                                  If(cntElementosSeguridadCAN.Visible, cntElementosSeguridadCAN.Height, 0) +
                                  cntSectionPiezasEspecialesCAN.Height +
                                  cmpCardTglPiezasEspecialesCAN.Height +
                                  If(cntPiezasEspecialesCAN.Visible, cntPiezasEspecialesCAN.Height, 0) +
                                  32
                              )
                          )
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Visible: =cmpCarddrpTipoCotización_CAN.Selected.Value = "Diseño" || cmpCarddrpTipoCotización_CAN.Selected.Value = "Planos/diseño de cliente"
                      Children:
                        - cntSectionCargaProductoCAN:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(scrFDI_CAN.Size = ScreenSize.Small, 56, 50)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =16
                              LayoutMinWidth: =0
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =12
                              Width: =Parent.Width
                            Children:
                              - shpDivCargaProductoCAN:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(210, 208, 206, 1)
                                    Height: =1
                                    LayoutMinHeight: =1
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width
                              - lblCargaProductoTituloCAN:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Max(22, Self.Size * 1.6)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =varTheme.Body
                                    TabIndex: =0
                                    Text: ="Carga / producto"
                                    Width: =Parent.Width
                        - cmpTxtTipoProductoCAN:
                            Control: CanvasComponent
                            ComponentName: cmpCardTxt
                            Properties:
                              DefaultValue: |
                                =Coalesce(varDraftActual.TipoProducto, "" )
                              Height: =60
                              OnChange: |-
                                =Patch( colCAN_Draft, LookUp(colCAN_Draft, SistemaId = locTabSel.SistemaId), {TipoProducto: Self.Value} )
                              Título: ="Tipo de producto"
                              Width: =Parent.Width
                        - cmpTxtLongitudCargaCAN:
                            Control: CanvasComponent
                            ComponentName: cmpCardTxt
                            Properties:
                              DefaultValue: |
                                =Coalesce(varDraftActual.LongitudCarga, "" )
                              Height: =60
                              OnChange: |-
                                =Patch( colCAN_Draft, LookUp(colCAN_Draft, SistemaId = locTabSel.SistemaId), {LongitudCarga: Self.Value} )
                              Título: ="Longitud de la carga"
                              Width: =Parent.Width
                        - cmpTxtSeccionCargaCAN:
                            Control: CanvasComponent
                            ComponentName: cmpCardTxt
                            Properties:
                              DefaultValue: |
                                =Coalesce(varDraftActual.SeccionCarga, "" )
                              Height: =60
                              OnChange: |-
                                =Patch( colCAN_Draft, LookUp(colCAN_Draft, SistemaId = locTabSel.SistemaId), {SeccionCarga: Self.Value} )
                              Título: ="Sección / diámetro / ancho"
                              Width: =Parent.Width
                        - cmpTxtPesoCargaCAN:
                            Control: CanvasComponent
                            ComponentName: cmpCardTxt
                            Properties:
                              DefaultValue: |
                                =Coalesce(varDraftActual.PesoCarga, "" )
                              Height: =60
                              OnChange: |-
                                =Patch( colCAN_Draft, LookUp(colCAN_Draft, SistemaId = locTabSel.SistemaId), {PesoCarga: Self.Value} )
                              Título: ="Peso por pieza / por nivel"
                              Width: =Parent.Width
                        - cmpTxtCantidadPorNivelCAN:
                            Control: CanvasComponent
                            ComponentName: cmpCardTxt
