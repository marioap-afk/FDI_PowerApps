    OnStart: "=// FDI security and role context\r\nSet(varUserEmail, Lower(User().Email));\r\nSet(varCotizadorFDI, LookUp(Cotizadores, Lower(Nombre.Email) = varUserEmail));\r\nSet(varRolFDI, Coalesce(varCotizadorFDI.Puesto.Value, \"Usuario\"));\r\nSet(varEsAdminFDI, Lower(varRolFDI) = \"administrador\" || Lower(varRolFDI) = \"admin\");\r\nSet(varEsCoordinadorFDI, Lower(varRolFDI) = \"coordinador\");\r\nSet(varEsUsuarioFDI, Not(IsBlank(varUserEmail)));\r\nSet(varPuedeVerTodoFDI, varEsAdminFDI || varEsCoordinadorFDI);\r\nSet(varPuedeAsignarFDI, varEsAdminFDI || varEsCoordinadorFDI);\r\nSet(varPuedeEditarMaestrosFDI, varEsAdminFDI);\r\nSet(varVendedorActualFDI, LookUp(Vendedores, Lower(Vendedor.Email) = varUserEmail && Activo = true));\r\nSet(\r\n    varVendedorActualLookupFDI,\r\n    If(\r\n        IsBlank(varVendedorActualFDI),\r\n        Blank(),\r\n        LookUp(Choices([@'Cotizaciones 2026'].VendedoresLookUp), Id = varVendedorActualFDI.ID)\r\n    )\r\n);\r\n// Catálogo fijo de sistemas/servicios que se pueden cotizar\r\nClearCollect(\r\n    colCatalogoSistemas,\r\n    {TipoKey:\"SEL\", Nombre:\"Selectivo\", ListaDestino:\"Sistema Selectivo\"},\r\n    {TipoKey:\"DIN\", Nombre:\"Dinámico\", ListaDestino:\"Sistema Dinámico\"},\r\n    {TipoKey:\"PBK\", Nombre:\"Pushback\", ListaDestino:\"Sistema Pushback\"},\r\n    {TipoKey:\"DRV\", Nombre:\"Drive In\", ListaDestino:\"Sistema Drive In\"},\r\n    {TipoKey:\"CAN\", Nombre:\"Cantiléver\", ListaDestino:\"Sistema Cantiléver\"},\r\n    {TipoKey:\"MEZ\", Nombre:\"Mezzanine\", ListaDestino:\"Sistema Mezzanine\"},\r\n    {TipoKey:\"CFL\", Nombre:\"Carton Flow\", ListaDestino:\"Sistema Carton Flow\"},\r\n    {TipoKey:\"MZL\", Nombre:\"Mezzanine Limpio\", ListaDestino:\"Sistema Mezzanine Limpio\"},\r\n    {TipoKey:\"OT\",  Nombre:\"Otro\",  ListaDestino:\"Otro\"}\r\n     \r\n);\r\n\r\n//Collect de listado de piezas\r\n// 1) Crear estructura de la colección (registro dummy)\r\nClearCollect(\r\n    colListadoPiezas,\r\n    {\r\n        RowId: GUID(),\r\n        SistemaId: 0,\r\n        Pieza: \"\",\r\n        Comentarios: \"\",\r\n        _Dummy: true\r\n    }\r\n);\r\n\r\n// 2) Quitar el dummy para que quede “vacía”\r\nRemoveIf(colListadoPiezas, _Dummy = true);\r\n\r\n//Collect de colores\r\nClearCollect(\r\n    colColores,\r\n    {ColorKey: \"AM109\", Nombre: \"Amarrillo C-109\"},\r\n    {ColorKey: \"AM5164\", Nombre: \"Amarillo tráfico sn 5164\"},\r\n    {ColorKey: \"AZ302\", Nombre: \"Azul extrafuerte HA 302 \"},\r\n    {ColorKey: \"AZ37112\", Nombre: \"Azul mcx 37112\"},\r\n    {ColorKey: \"AZ9260\", Nombre: \"Azul Nissan 9260\"},\r\n    {ColorKey: \"BL11290\", Nombre: \"Blanco 11290\"},\r\n    {ColorKey: \"B2448\", Nombre: \"Biskut 2448 (Beige claro)\"},\r\n    {ColorKey: \"G307\", Nombre: \"Gris HA 307\"},\r\n    {ColorKey: \"NAR21374\", Nombre: \"Naranja mcx 21374\"},\r\n    {ColorKey: \"NARMR\", Nombre: \"Naranja mr\"},\r\n    {ColorKey: \"N10005903\", Nombre: \"Negro 10005903\"},\r\n    {ColorKey: \"RO32597\", Nombre: \"Rojo súper 32597\"},\r\n    {ColorKey: \"VEHNK\", Nombre: \"Verde Hnk\"},\r\n    {ColorKey: \"VEPINO\", Nombre: \"Verde pino\"},\r\n    {ColorKey: \"VE21373\", Nombre: \"Verde vista Green 21373\"},\r\n    {ColorKey: \"B19919\", Nombre: \"Beige alum 19919 \"},\r\n    {ColorKey: \"GA\", Nombre: \"Galvanizado\"},\r\n    {ColorKey: \"SN\", Nombre: \"Sin acabado\"},\r\n    {ColorKey: \"NA\", Nombre: \"N/A\"}\r\n);\r\n\r\n//Se define dispositivo\r\nSet(varDispositivo,\r\n    If(\r\n        App.Width < 600, \"Celular\",\r\n        App.Width < 1024, \"Tablet\",\r\n        \"Escritorio\"\r\n    )\r\n);\r\n\r\n// Default (record)\r\nSet(\r\n    varThemeDefault,\r\n    Switch(\r\n        varDispositivo,\r\n\r\n        \"Celular\",\r\n        { \r\n            _HasUserOverride: false, \r\n            H1: 22,\r\n            H1Espesor: \"Semibold\", \r\n            H2: 18,\r\n            H2Espesor: \"Semibold\",  \r\n            H3: 16,\r\n            H3Espesor: \"Semibold\",  \r\n            Body: 14,\r\n            BodyEspesor: \"Regular\", \r\n            Small: 12,\r\n            SmallEspesor: \"Regular\", \r\n            Label: 13,\r\n            LabelEspesor: \"Medium\", \r\n            PrimarioHex: \"#0F62FE\", \r\n            SecundarioHex: \"#6F7B8A\",\r\n            FondoHex: \"#F4F6F9\"  ,\r\n            ÉnfasisHex: \"#42BE65\",\r\n            AlertaHex: \"#DA1E28\",\r\n            TextoHex: \"#1F2937\",\r\n            TextoSuaveHex: \"#667085\",\r\n            SuperficieHex: \"#FFFFFF\",\r\n            SuperficieAltHex: \"#F8FAFC\",\r\n            BordeHex: \"#D0D7DE\",\r\n            BordeSuaveHex: \"#E5E7EB\",\r\n            HeaderTablaHex: \"#EEF4FF\",\r\n            HoverHex: \"#EAF2FF\",\r\n            SeleccionHex: \"#DCEBFF\",\r\n            CardRadius: 8,\r\n            ControlRadius: 6,\r\n            Sombra: DropShadow.Light,\r\n            Gap: 12,\r\n            CardPadding: 16,\r\n            RowHeight: 60,\r\n            HeaderHeight: 40,\r\n            FieldHeight: 64\r\n        },\r\n\r\n        \"Tablet\",\r\n        { \r\n            _HasUserOverride: false, \r\n            H1: 26,\r\n            H1Espesor: \"Semibold\", \r\n            H2: 20,\r\n            H2Espesor: \"Semibold\",  \r\n            H3: 18,\r\n            H3Espesor: \"Semibold\", \r\n            Body: 15,\r\n            BodyEspesor: \"Regular\", \r\n            Small: 12,\r\n            SmallEspesor: \"Regular\", \r\n            Label: 13,\r\n            LabelEspesor: \"Medium\", \r\n            PrimarioHex: \"#0073E6\", \r\n            SecundarioHex: \"#6F7B8A\",\r\n            FondoHex: \"#F4F6F9\"  ,\r\n            ÉnfasisHex: \"#42BE65\",\r\n            AlertaHex: \"#DA1E28\",\r\n            TextoHex: \"#1F2937\",\r\n            TextoSuaveHex: \"#667085\",\r\n            SuperficieHex: \"#FFFFFF\",\r\n            SuperficieAltHex: \"#F8FAFC\",\r\n            BordeHex: \"#D0D7DE\",\r\n            BordeSuaveHex: \"#E5E7EB\",\r\n            HeaderTablaHex: \"#EEF4FF\",\r\n            HoverHex: \"#EAF2FF\",\r\n            SeleccionHex: \"#DCEBFF\",\r\n            CardRadius: 8,\r\n            ControlRadius: 6,\r\n            Sombra: DropShadow.Light,\r\n            Gap: 12,\r\n            CardPadding: 16,\r\n            RowHeight: 60,\r\n            HeaderHeight: 40,\r\n            FieldHeight: 64 \r\n        },\r\n\r\n        { \r\n            _HasUserOverride: false, \r\n            H1: 30,\r\n            H1Espesor: \"Semibold\",  \r\n            H2: 24,\r\n            H2Espesor: \"Semibold\",  \r\n            H3: 20,\r\n            H3Espesor: \"Semibold\", \r\n            Body: 15,\r\n            BodyEspesor: \"Regular\", \r\n            Small: 12,\r\n            SmallEspesor: \"Regular\", \r\n            Label: 13,\r\n            LabelEspesor: \"Medium\", \r\n            PrimarioHex: \"#0073E6\", \r\n            SecundarioHex: \"#6F7B8A\",\r\n            FondoHex: \"#F4F6F9\"  ,\r\n            ÉnfasisHex: \"#42BE65\",\r\n            AlertaHex: \"#DA1E28\",\r\n            TextoHex: \"#1F2937\",\r\n            TextoSuaveHex: \"#667085\",\r\n            SuperficieHex: \"#FFFFFF\",\r\n            SuperficieAltHex: \"#F8FAFC\",\r\n            BordeHex: \"#D0D7DE\",\r\n            BordeSuaveHex: \"#E5E7EB\",\r\n            HeaderTablaHex: \"#EEF4FF\",\r\n            HoverHex: \"#EAF2FF\",\r\n            SeleccionHex: \"#DCEBFF\",\r\n            CardRadius: 8,\r\n            ControlRadius: 6,\r\n            Sombra: DropShadow.Light,\r\n            Gap: 12,\r\n            CardPadding: 16,\r\n            RowHeight: 60,\r\n            HeaderHeight: 40,\r\n            FieldHeight: 64 \r\n        }\r\n    )\r\n);\r\n\r\n// Colección “tema activo” (1 fila)\r\nClearCollect(colTheme, varThemeDefault);\r\n\r\n// Colección “tema usuario” (1 fila) para cargar\r\nClearCollect(colThemeUser, varThemeDefault);\r\nLoadData(colThemeUser, \"FDI_THEME_\" & varDispositivo, true);\r\n\r\n// Aplicar override si existe\r\nIf(\r\n    First(colThemeUser)._HasUserOverride,\r\n    ClearCollect(colTheme, Patch(varThemeDefault, First(colThemeUser))),\r\n    ClearCollect(colTheme, varThemeDefault)\r\n);\r\n\r\nSet(varTheme, First(colTheme))\r\n"
