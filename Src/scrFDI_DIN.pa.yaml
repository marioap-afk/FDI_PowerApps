                  - cntDiseñoDIN:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: |-
                          =If(
                              cmpCarddrpTipoCotización_DIN.Selected.Value = "Planos/diseño de cliente",
                              cntTarimasDIN.Height + 32,
