                              Height: =varTheme.HeaderHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                            Children:
                              - lblPiezaHeaderDIN:
