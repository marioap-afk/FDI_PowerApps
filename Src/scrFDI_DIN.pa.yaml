                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Visible: =cmpCarddrpTipoCotización_DIN.Selected.Value = "Listado de piezas"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =40
                      Children:
                        - cntListadoDePiezasBotonesDIN:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =2
                              PaddingRight: =2
                            Children:
                              - lblListadoDePiezasDIN:
                                  Control: Label@2.5.1
