Screens:
  scrFDI_CFL:
    Properties:
      Fill: =ColorValue(varTheme.FondoHex)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varVista, "Sistemas");
        If(
            IsBlank(locTabSel) && CountRows(Filter(colTabs, TipoKey = "CFL")) > 0,
            UpdateContext({locTabSel: First(Filter(colTabs, TipoKey = "CFL"))})
        );
        Set(varDraftActual, LookUp(colCFL_Draft, SistemaId = locTabSel.SistemaId))
    Children:
      - cntFDISistemaCFL:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =ColorValue(varTheme.FondoHex)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(scrFDI_CFL.Size = ScreenSize.Small, 8, 16)
            PaddingLeft: =If(scrFDI_CFL.Size = ScreenSize.Small, 8, 16)
            PaddingRight: =If(scrFDI_CFL.Size = ScreenSize.Small, 8, 16)
            PaddingTop: =If(scrFDI_CFL.Size = ScreenSize.Small, 8, 16)
            Width: =Parent.Width
          Children:
            - cntFDISistemaBarCFL:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                  BorderThickness: =1
                  DropShadow: =varTheme.Sombra
                  Fill: =ColorValue(varTheme.SuperficieHex)
                  RadiusBottomLeft: =varTheme.CardRadius
                  RadiusBottomRight: =varTheme.CardRadius
                  RadiusTopLeft: =varTheme.CardRadius
                  RadiusTopRight: =varTheme.CardRadius
                  FillPortions: =0
                  Height: =If(scrFDI_CFL.Size = ScreenSize.Small, 52, 60)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =44
                  LayoutMinWidth: =0
                  PaddingBottom: =6
                  PaddingLeft: =If(scrFDI_CFL.Size = ScreenSize.Small, 8, 12)
                  PaddingRight: =If(scrFDI_CFL.Size = ScreenSize.Small, 8, 12)
                  PaddingTop: =6
                Children:
                  - icoFDISistemaVolverCFL:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Volver"
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =ColorValue(varTheme.PrimarioHex)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Height: =If(scrFDI_CFL.Size = ScreenSize.Small, 36, 40)
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(16, 110, 190, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.BackArrow
                        OnSelect: |-
                          =Set(varFDIRetornarSistemas, true);
                          Navigate(scrFDI, ScreenTransition.None, {locTabSel: locTabSel})
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(16, 110, 190, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        TabIndex: =0
                        Tooltip: ="Volver"
                        Width: =If(scrFDI_CFL.Size = ScreenSize.Small, 36, 40)
                  - lblFDISistemaTituloCFL:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =ColorValue(varTheme.TextoHex)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height - 12
                        LayoutMinWidth: =0
                        Size: =If(scrFDI_CFL.Size = ScreenSize.Small, varTheme.Label, varTheme.H3)
                        Text: =Coalesce(locTabSel.NombreSistema, "Carton Flow")
                        Width: =Max(0, Parent.Width - icoFDISistemaVolverCFL.Width - 24)
                        Wrap: =false
            - cntCFL:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  Visible: =CountRows(colTabs) > 0 && Coalesce(locTabSel.TipoKey, "") = "CFL"
                  Width: =Parent.Width
                  X: =40
                  Y: =40
                Children:
                  - cmpCarddrpTipoCotización_CFL:
                      Control: CanvasComponent
                      ComponentName: cmpCarddrp
                      Properties:
                        DefaultSelectedItem: |-
                          =With(
                              {_valor: varDraftActual.MetodoCaptura},
                              If(
                                  IsBlank(_valor),
                                  Blank(),
                                  LookUp(cmpCarddrpTipoCotización_CFL.Items, Value = _valor)
                              )
                          )
                        Height: =60
                        Items: |-
                          =Table(
                              {Value: "Diseño"},
                              {Value: "Listado de piezas"},
                              {Value: "Planos/diseño de cliente"},
                              {Value: "Cotización o pedido anterior"}
                          )
                        OnChange: |-
                          =Patch(
                              colCFL_Draft,
                              LookUp(colCFL_Draft, SistemaId = locTabSel.SistemaId),
                              {
                                  MetodoCaptura: Self.Selected.Value,
                                  TipoDiseño: Self.Selected.Value
                              }
                          )
                        Título: ="Método de captura"
                  - cntListadoDePiezasCFL:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                        BorderThickness: =1
                        DropShadow: =varTheme.Sombra
                        Fill: =ColorValue(varTheme.SuperficieHex)
                        RadiusBottomLeft: =varTheme.CardRadius
                        RadiusBottomRight: =varTheme.CardRadius
                        RadiusTopLeft: =varTheme.CardRadius
                        RadiusTopRight: =varTheme.CardRadius
                        FillPortions: =0
                        Height: =cntListadoDePiezasBotonesCFL.Height+cntListadoDePiezasHeaderCFL.Height+galListadoDePiezasCFL.Height+32
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Visible: =cmpCarddrpTipoCotización_CFL.Selected.Value = "Listado de piezas"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =40
                      Children:
                        - cntListadoDePiezasBotonesCFL:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =2
                              PaddingRight: =2
                            Children:
                              - lblListadoDePiezasCFL:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =16
                                    TabIndex: =0
                                    Text: ="Listado de piezas"
                                    Width: =Parent.Width - btnAgregarPiezaCFL.Width - 24
                              - btnAgregarPiezaCFL:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="btn Agregar Pieza CFL"
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Height: =36
                                    Icon: ="Add"
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =Collect(
                                          colListadoPiezas,
                                          {
                                              RowId: GUID(),
                                              SistemaId: locTabSel.SistemaId,
                                              Pieza: "",
                                              Comentarios: ""
                                          }
                                      );
                                    Text: ="Agregar"
                                    Width: =120
                        - cntListadoDePiezasHeaderCFL:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorValue(varTheme.BordeHex)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue(varTheme.HeaderTablaHex)
                              FillPortions: =0
                              Height: =varTheme.HeaderHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                            Children:
                              - lblPiezaHeaderCFL:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Pieza"
                                    Width: =Max(260, Min(420, Parent.Width * 0.32))
                              - lblComentarioHeaderCFL:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Comentario"
                                    Width: =Max(360, Parent.Width - lblPiezaHeaderCFL.Width - lblAccionHeaderCFL.Width - 64)
                              - lblAccionHeaderCFL:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Acción"
                                    Width: =64
                        - galListadoDePiezasCFL:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextVariant_ver5.0
                            Properties:
                              AccessibleLabel: ="gal Listado De Piezas CFL"
                              BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                              BorderThickness: =1
                              FillPortions: =0
                              Height: =If(CountRows(Self.AllItems)=0,0,Min(galListadoDePiezasCFL.TemplateHeight*CountRows(Self.AllItems),420))
                              Items: |-
                                =Filter(
                                    colListadoPiezas,
                                    SistemaId = locTabSel.SistemaId
                                )
                              LayoutMinHeight: =16
                              Selectable: =false
                              TabIndex: =0
                              TemplateSize: =varTheme.RowHeight
                            Children:
                              - BorrarPiezaButton_CFL:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Borrar Pieza Button"
                                    Align: =Align.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    Height: =36
                                    Icon: ="Delete"
                                    OnSelect: =Remove(colListadoPiezas, ThisItem)
                                    Text: =""
                                    Width: =44
                                    X: =Parent.TemplateWidth - Self.Width - 16
                                    Y: =12
                              - ComentarioInput_CFL:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Comentario Input"
                                    BorderColor: =ColorValue(varTheme.BordeHex)
                                    BorderThickness: =1
                                    Color: =ColorValue(varTheme.TextoHex)
                                    Default: =ThisItem.Pieza
                                    DelayOutput: =true
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    HoverBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    HoverColor: =ColorValue(varTheme.TextoHex)
                                    HoverFill: =ColorValue(varTheme.SuperficieHex)
                                    OnChange: |-
                                      =Patch(
                                          colListadoPiezas,
                                          ThisItem,
                                          {
                                              Pieza: Self.Text
                                          }
                                      )
                                    PressedBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    PressedColor: =ColorValue(varTheme.TextoHex)
                                    PressedFill: =ColorValue(varTheme.SuperficieHex)
                                    RadiusBottomLeft: =varTheme.ControlRadius
                                    RadiusBottomRight: =varTheme.ControlRadius
                                    RadiusTopLeft: =varTheme.ControlRadius
                                    RadiusTopRight: =varTheme.ControlRadius
                                    Width: =Max(260, Min(420, Parent.TemplateWidth * 0.32))
                                    X: =16
                                    Y: =12
                              - PiezaInput_CFL:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Pieza Input"
                                    BorderColor: =ColorValue(varTheme.BordeHex)
                                    BorderThickness: =1
                                    Color: =ColorValue(varTheme.TextoHex)
                                    Default: =ThisItem.Comentarios
                                    DelayOutput: =true
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    HoverBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    HoverColor: =ColorValue(varTheme.TextoHex)
                                    HoverFill: =ColorValue(varTheme.SuperficieHex)
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =Patch(
                                          colListadoPiezas,
                                          ThisItem,
                                          {
                                              Comentarios: Self.Text
                                          }
                                      )
                                    PressedBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    PressedColor: =ColorValue(varTheme.TextoHex)
                                    PressedFill: =ColorValue(varTheme.SuperficieHex)
                                    RadiusBottomLeft: =varTheme.ControlRadius
                                    RadiusBottomRight: =varTheme.ControlRadius
                                    RadiusTopLeft: =varTheme.ControlRadius
                                    RadiusTopRight: =varTheme.ControlRadius
                                    Width: =Max(360, Parent.TemplateWidth - ComentarioInput_CFL.Width - BorrarPiezaButton_CFL.Width - 64)
                                    X: =ComentarioInput_CFL.X + ComentarioInput_CFL.Width + 16
                                    Y: =12
                              - ComentarioLabel_CFL:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =ColorValue(varTheme.TextoSuaveHex)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: ="Comentario"
                                    Visible: =false
                                    Width: =PiezaInput_CFL.Width
                                    X: =PiezaInput_CFL.X
                                    Y: =8
                              - PiezaLabel_CFL:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =ColorValue(varTheme.TextoSuaveHex)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: ="Pieza"
                                    Visible: =false
                                    Width: =ComentarioInput_CFL.Width
                                    X: =ComentarioInput_CFL.X
                                    Y: =8
                              - Separator2_CFL:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(237, 235, 233, 1)
                                    Height: =1
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - Self.Height
                  - cntDiseñoCFL:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: |-
                          =If(
                              cmpCarddrpTipoCotización_CFL.Selected.Value = "Planos/diseño de cliente",
                              cntSectionCargaProductoCFL.Height +
                              cntProductosCFL.Height +
                              32,
                              Max(
                                  760,
                                  cntSectionCargaProductoCFL.Height +
                                  cntProductosCFL.Height +
                                  cntSectionConfigRackCFL.Height +
                                  cmpTxtFrentesBuscadosCFL.Height +
                                  cmpTxtFondosBuscadosCFL.Height +
                                  cmpTxtNivelesBuscadosCFL.Height +
                                  cmpCarddrpTipoRodamientoCFL.Height +
                                  cmpCarddrpMetodoEntrecentrosCFL.Height +
                                  If(cmpTxtEntrecentrosManualCFL.Visible, cmpTxtEntrecentrosManualCFL.Height, 0) +
                                  cntSectionAreaPasillosCFL.Height +
                                  cmpTxtAnchoDispCFL.Height +
                                  cmpTxtLargoDispCFL.Height +
                                  cmpTxtAnchoPasilloPickeoCFL.Height +
                                  cntSectionCriteriosNivelesCFL.Height +
                                  cmpCardTglAlturaNaveCFL.Height +
                                  If(cmpTxtAlturaMaxNaveCFL.Visible, cmpTxtAlturaMaxNaveCFL.Height, 0) +
                                  If(cmpTxtAlturaMinNaveCFL.Visible, cmpTxtAlturaMinNaveCFL.Height, 0) +
                                  cmpCardTglAdjuntarImagenLayoutCFL.Height +
                                  If(lblAdjuntarArchivosCFL.Visible, lblAdjuntarArchivosCFL.Height, 0) +
                                  cmpCardTglDefClienteCFL.Height +
                                  If(cmpTxtComentariosConfigClienteCFL.Visible, cmpTxtComentariosConfigClienteCFL.Height, 0) +
                                  cntSectionSeguridadCFL.Height +
                                  cmpCardTglElementosSeguridadCFL.Height +
                                  If(cntElementosSeguridadCFL.Visible, cntElementosSeguridadCFL.Height, 0) +
                                  cntSectionPiezasEspecialesCFL.Height +
                                  cmpCardTglPiezasEspecialesCFL.Height +
                                  If(cntPiezasEspecialesCFL.Visible, cntPiezasEspecialesCFL.Height, 0) +
                                  32
                              )
                          )
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Visible: =cmpCarddrpTipoCotización_CFL.Selected.Value = "Diseño" || cmpCarddrpTipoCotización_CFL.Selected.Value = "Planos/diseño de cliente"
                      Children:
                        - cntSectionCargaProductoCFL:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(scrFDI_CFL.Size = ScreenSize.Small, 56, 50)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =16
                              LayoutMinWidth: =0
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =12
                              Width: =Parent.Width
                            Children:
                              - shpDivCargaProductoCFL:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(210, 208, 206, 1)
                                    Height: =1
                                    LayoutMinHeight: =1
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width
                              - lblCargaProductoTituloCFL:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Max(22, Self.Size * 1.6)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =varTheme.Body
                                    TabIndex: =0
                                    Text: ="Producto"
                                    Width: =Parent.Width
                        - cntProductosCFL:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                              BorderThickness: =1
                              DropShadow: =varTheme.Sombra
                              Fill: =ColorValue(varTheme.SuperficieHex)
                              RadiusBottomLeft: =varTheme.CardRadius
                              RadiusBottomRight: =varTheme.CardRadius
                              RadiusTopLeft: =varTheme.CardRadius
                              RadiusTopRight: =varTheme.CardRadius
                              FillPortions: =0
                              Height: =cntProductosBtnCFL.Height + If(cntProductosHeaderCFL.Visible, cntProductosHeaderCFL.Height, 0) + galProductosCFL.Height + 32
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =16
                              LayoutMinWidth: =0
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              Width: =Parent.Width - 32
                            Children:
                              - cntProductosBtnCFL:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =42
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =0
                                    PaddingLeft: =2
                                    PaddingRight: =2
                                  Children:
                                    - lblProductosCFL:
                                        Control: Label@2.5.1
                                        Properties:
                                          AutoHeight: =true
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          Color: =ColorValue(varTheme.TextoHex)
                                          DisabledColor: =RGBA(161, 159, 157, 1)
                                          FocusedBorderThickness: =4
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =0
                                          Size: =varTheme.Body
