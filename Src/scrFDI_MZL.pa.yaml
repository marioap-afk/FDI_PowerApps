Screens:
  scrFDI_MZL:
    Properties:
      Fill: =ColorValue(varTheme.FondoHex)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varVista, "Sistemas");
        If(
            IsBlank(locTabSel) && CountRows(Filter(colTabs, TipoKey = "MZL")) > 0,
            UpdateContext({locTabSel: First(Filter(colTabs, TipoKey = "MZL"))})
        );
        Set(varDraftActual, LookUp(colMZL_Draft, SistemaId = locTabSel.SistemaId))
    Children:
      - cntFDISistemaMZL:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =ColorValue(varTheme.FondoHex)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(scrFDI_MZL.Size = ScreenSize.Small, 8, 16)
            PaddingLeft: =If(scrFDI_MZL.Size = ScreenSize.Small, 8, 16)
            PaddingRight: =If(scrFDI_MZL.Size = ScreenSize.Small, 8, 16)
            PaddingTop: =If(scrFDI_MZL.Size = ScreenSize.Small, 8, 16)
            Width: =Parent.Width
          Children:
            - cntFDISistemaBarMZL:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                  BorderThickness: =1
                  DropShadow: =varTheme.Sombra
                  Fill: =ColorValue(varTheme.SuperficieHex)
                  RadiusBottomLeft: =varTheme.CardRadius
                  RadiusBottomRight: =varTheme.CardRadius
                  RadiusTopLeft: =varTheme.CardRadius
                  RadiusTopRight: =varTheme.CardRadius
                  FillPortions: =0
                  Height: =If(scrFDI_MZL.Size = ScreenSize.Small, 52, 60)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =44
                  LayoutMinWidth: =0
                  PaddingBottom: =6
                  PaddingLeft: =If(scrFDI_MZL.Size = ScreenSize.Small, 8, 12)
                  PaddingRight: =If(scrFDI_MZL.Size = ScreenSize.Small, 8, 12)
                  PaddingTop: =6
                Children:
                  - icoFDISistemaVolverMZL:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Volver"
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =ColorValue(varTheme.PrimarioHex)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Height: =If(scrFDI_MZL.Size = ScreenSize.Small, 36, 40)
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(16, 110, 190, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.BackArrow
                        OnSelect: |-
                          =Set(varFDIRetornarSistemas, true);
                          Navigate(scrFDI, ScreenTransition.None, {locTabSel: locTabSel})
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(16, 110, 190, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        TabIndex: =0
                        Tooltip: ="Volver"
                        Width: =If(scrFDI_MZL.Size = ScreenSize.Small, 36, 40)
                  - lblFDISistemaTituloMZL:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =ColorValue(varTheme.TextoHex)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height - 12
                        LayoutMinWidth: =0
                        Size: =If(scrFDI_MZL.Size = ScreenSize.Small, varTheme.Label, varTheme.H3)
                        Text: =Coalesce(locTabSel.NombreSistema, "Mezzanine Limpio")
                        Width: =Max(0, Parent.Width - icoFDISistemaVolverMZL.Width - 24)
                        Wrap: =false
            - cntMZL:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  Visible: =CountRows(colTabs) > 0 && Coalesce(locTabSel.TipoKey, "") = "MZL"
                  Width: =Parent.Width
                  X: =40
                  Y: =40
                Children:
                  - cmpCarddrpTipoCotización_MZL:
                      Control: CanvasComponent
                      ComponentName: cmpCarddrp
                      Properties:
                        DefaultSelectedItem: |-
                          =With(
                              {_valor: varDraftActual.MetodoCaptura},
                              If(
                                  IsBlank(_valor),
                                  Blank(),
                                  LookUp(cmpCarddrpTipoCotización_MZL.Items, Value = _valor)
                              )
                          )
                        Height: =60
                        Items: |-
                          =Table(
                              {Value: "Diseño"},
                              {Value: "Listado de piezas"},
                              {Value: "Planos/diseño de cliente"},
                              {Value: "Cotización o pedido anterior"}
                          )
                        OnChange: |-
                          =Patch(
                              colMZL_Draft,
                              LookUp(colMZL_Draft, SistemaId = locTabSel.SistemaId),
                              {
                                  MetodoCaptura: Self.Selected.Value,
                                  TipoDiseño: Self.Selected.Value
                              }
                          )
                        Título: ="Método de captura"
                  - cntListadoDePiezasMZL:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                        BorderThickness: =1
                        DropShadow: =varTheme.Sombra
                        Fill: =ColorValue(varTheme.SuperficieHex)
                        RadiusBottomLeft: =varTheme.CardRadius
                        RadiusBottomRight: =varTheme.CardRadius
                        RadiusTopLeft: =varTheme.CardRadius
                        RadiusTopRight: =varTheme.CardRadius
                        FillPortions: =0
                        Height: =cntListadoDePiezasBotonesMZL.Height+cntListadoDePiezasHeaderMZL.Height+galListadoDePiezasMZL.Height+32
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Visible: =cmpCarddrpTipoCotización_MZL.Selected.Value = "Listado de piezas"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =40
                      Children:
                        - cntListadoDePiezasBotonesMZL:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =2
                              PaddingRight: =2
                            Children:
                              - lblListadoDePiezasMZL:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =16
                                    TabIndex: =0
                                    Text: ="Listado de piezas"
                                    Width: =Parent.Width - btnAgregarPiezaMZL.Width - 24
                              - btnAgregarPiezaMZL:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="btn Agregar Pieza MZL"
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Height: =36
                                    Icon: ="Add"
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =Collect(
                                          colListadoPiezas,
                                          {
                                              RowId: GUID(),
                                              SistemaId: locTabSel.SistemaId,
                                              Pieza: "",
                                              Comentarios: ""
                                          }
                                      );
                                    Text: ="Agregar"
                                    Width: =120
                        - cntListadoDePiezasHeaderMZL:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorValue(varTheme.BordeHex)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue(varTheme.HeaderTablaHex)
                              FillPortions: =0
                              Height: =varTheme.HeaderHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                            Children:
                              - lblPiezaHeaderMZL:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Pieza"
                                    Width: =Max(260, Min(420, Parent.Width * 0.32))
                              - lblComentarioHeaderMZL:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Comentario"
                                    Width: =Max(360, Parent.Width - lblPiezaHeaderMZL.Width - lblAccionHeaderMZL.Width - 64)
                              - lblAccionHeaderMZL:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Acción"
                                    Width: =64
                        - galListadoDePiezasMZL:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextVariant_ver5.0
                            Properties:
                              AccessibleLabel: ="gal Listado De Piezas MZL"
                              BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                              BorderThickness: =1
                              FillPortions: =0
                              Height: =If(CountRows(Self.AllItems)=0,0,Min(galListadoDePiezasMZL.TemplateHeight*CountRows(Self.AllItems),420))
                              Items: |-
                                =Filter(
                                    colListadoPiezas,
                                    SistemaId = locTabSel.SistemaId
                                )
                              LayoutMinHeight: =16
                              Selectable: =false
                              TabIndex: =0
                              TemplateSize: =varTheme.RowHeight
                            Children:
                              - BorrarPiezaButton_MZL:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Borrar Pieza Button"
                                    Align: =Align.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    Height: =36
                                    Icon: ="Delete"
                                    OnSelect: =Remove(colListadoPiezas, ThisItem)
                                    Text: =""
                                    Width: =44
                                    X: =Parent.TemplateWidth - Self.Width - 16
                                    Y: =12
                              - ComentarioInput_MZL:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Comentario Input"
                                    BorderColor: =ColorValue(varTheme.BordeHex)
                                    BorderThickness: =1
                                    Color: =ColorValue(varTheme.TextoHex)
                                    Default: =ThisItem.Pieza
                                    DelayOutput: =true
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    HoverBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    HoverColor: =ColorValue(varTheme.TextoHex)
                                    HoverFill: =ColorValue(varTheme.SuperficieHex)
                                    OnChange: |-
                                      =Patch(
                                          colListadoPiezas,
                                          ThisItem,
                                          {
                                              Pieza: Self.Text
                                          }
                                      )
                                    PressedBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    PressedColor: =ColorValue(varTheme.TextoHex)
                                    PressedFill: =ColorValue(varTheme.SuperficieHex)
                                    RadiusBottomLeft: =varTheme.ControlRadius
                                    RadiusBottomRight: =varTheme.ControlRadius
                                    RadiusTopLeft: =varTheme.ControlRadius
                                    RadiusTopRight: =varTheme.ControlRadius
                                    Width: =Max(260, Min(420, Parent.TemplateWidth * 0.32))
                                    X: =16
                                    Y: =12
                              - PiezaInput_MZL:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Pieza Input"
                                    BorderColor: =ColorValue(varTheme.BordeHex)
                                    BorderThickness: =1
                                    Color: =ColorValue(varTheme.TextoHex)
                                    Default: =ThisItem.Comentarios
                                    DelayOutput: =true
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    HoverBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    HoverColor: =ColorValue(varTheme.TextoHex)
                                    HoverFill: =ColorValue(varTheme.SuperficieHex)
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =Patch(
                                          colListadoPiezas,
                                          ThisItem,
                                          {
                                              Comentarios: Self.Text
                                          }
                                      )
                                    PressedBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    PressedColor: =ColorValue(varTheme.TextoHex)
                                    PressedFill: =ColorValue(varTheme.SuperficieHex)
                                    RadiusBottomLeft: =varTheme.ControlRadius
                                    RadiusBottomRight: =varTheme.ControlRadius
                                    RadiusTopLeft: =varTheme.ControlRadius
                                    RadiusTopRight: =varTheme.ControlRadius
                                    Width: =Max(360, Parent.TemplateWidth - ComentarioInput_MZL.Width - BorrarPiezaButton_MZL.Width - 64)
                                    X: =ComentarioInput_MZL.X + ComentarioInput_MZL.Width + 16
                                    Y: =12
                              - ComentarioLabel_MZL:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =ColorValue(varTheme.TextoSuaveHex)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: ="Comentario"
                                    Visible: =false
                                    Width: =PiezaInput_MZL.Width
                                    X: =PiezaInput_MZL.X
                                    Y: =8
                              - PiezaLabel_MZL:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =ColorValue(varTheme.TextoSuaveHex)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: ="Pieza"
                                    Visible: =false
                                    Width: =ComentarioInput_MZL.Width
                                    X: =ComentarioInput_MZL.X
                                    Y: =8
                              - Separator2_MZL:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(237, 235, 233, 1)
                                    Height: =1
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - Self.Height
                  - cntDiseñoMZL:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: |-
                          =Max(
                              820,
                              cntSectionConfigMezzanineMZL.Height +
                              cmpTxtCantidadPisosMZL.Height +
                              cmpTxtCargaPorM2MZL.Height +
                              cmpCardTglModuladoMZL.Height +
                              If(cmpTxtZonaModuladaMZL.Visible, cmpTxtZonaModuladaMZL.Height, 0) +
                              cmpCardTglTarimasNoModuladasMZL.Height +
                              cmpCardTglElevadorMZL.Height +
                              If(cmpTxtElevadorSpecMZL.Visible, cmpTxtElevadorSpecMZL.Height, 0) +
                              cmpCarddrpTipoPisoMZL.Height +
                              cmpCardTglCarritoMZL.Height +
                              If(cmpTxtMedidasCarritoMZL.Visible, cmpTxtMedidasCarritoMZL.Height, 0) +
                              If(cmpTxtNumeroRuedasMZL.Visible, cmpTxtNumeroRuedasMZL.Height, 0) +
                              If(cmpTxtTipoRuedaMZL.Visible, cmpTxtTipoRuedaMZL.Height, 0) +
                              If(cmpTxtMedidaRuedaMZL.Visible, cmpTxtMedidaRuedaMZL.Height, 0) +
                              If(cmpTxtPesoCarritoMZL.Visible, cmpTxtPesoCarritoMZL.Height, 0) +
                              cmpCardTglEscalerasMZL.Height +
                              cntSectionColumnasMZL.Height +
                              cmpCarddrpSeparacionColumnasMZL.Height +
                              If(cmpTxtSeparacionColumnasManualMZL.Visible, cmpTxtSeparacionColumnasManualMZL.Height, 0) +
                              If(cntSectionCargaProductoMZL.Visible, cntSectionCargaProductoMZL.Height, 0) +
                              If(cntProductosMZL.Visible, cntProductosMZL.Height, 0) +
                              If(cntTarimasMZL.Visible, cntTarimasMZL.Height, 0) +
                              cntSectionAreaPasillosMZL.Height +
                              cmpTxtAnchoDispMZL.Height +
                              cmpTxtLargoDispMZL.Height +
                              cmpTxtAnchoPasilloPickeoMZL.Height +
                              cntSectionCriteriosNivelesMZL.Height +
                              cmpCardTglAlturaNaveMZL.Height +
                              If(cmpTxtAlturaMaxNaveMZL.Visible, cmpTxtAlturaMaxNaveMZL.Height, 0) +
                              If(cmpTxtAlturaMinNaveMZL.Visible, cmpTxtAlturaMinNaveMZL.Height, 0) +
                              cmpCardTglAdjuntarImagenLayoutMZL.Height +
                              If(lblAdjuntarArchivosMZL.Visible, lblAdjuntarArchivosMZL.Height, 0) +
                              cmpCardTglDefClienteMZL.Height +
                              If(cmpTxtComentariosConfigClienteMZL.Visible, cmpTxtComentariosConfigClienteMZL.Height, 0) +
                              cntSectionSeguridadMZL.Height +
                              cmpCardTglElementosSeguridadMZL.Height +
                              If(cntElementosSeguridadMZL.Visible, cntElementosSeguridadMZL.Height, 0) +
                              cntSectionPiezasEspecialesMZL.Height +
                              cmpCardTglPiezasEspecialesMZL.Height +
                              If(cntPiezasEspecialesMZL.Visible, cntPiezasEspecialesMZL.Height, 0) +
                              32
                          )
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Visible: =cmpCarddrpTipoCotización_MZL.Selected.Value = "Diseño" || cmpCarddrpTipoCotización_MZL.Selected.Value = "Planos/diseño de cliente"
                      Children:
                        - cntSectionConfigMezzanineMZL:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(scrFDI_MZL.Size = ScreenSize.Small, 56, 50)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =16
                              LayoutMinWidth: =0
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =12
                              Visible: =(cmpCarddrpTipoCotización_MZL.Selected.Value = "Diseño" || cmpCarddrpTipoCotización_MZL.Selected.Value = "Planos/diseño de cliente")
                              Width: =Parent.Width
                            Children:
                              - shpDivConfigMezzanineMZL:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(210, 208, 206, 1)
                                    Height: =1
                                    LayoutMinHeight: =1
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width
                              - lblConfigMezzanineTituloMZL:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Max(22, Self.Size * 1.6)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =varTheme.Body
                                    TabIndex: =0
                                    Text: ="Configuración del mezzanine"
                                    Width: =Parent.Width
                        - cmpTxtCantidadPisosMZL:
                            Control: CanvasComponent
                            ComponentName: cmpCardTxt
                            Properties:
                              DefaultValue: =Coalesce(varDraftActual.CantidadPisos, "")
                              Height: =60
                              OnChange: |-
                                =Patch(colMZL_Draft, LookUp(colMZL_Draft, SistemaId = locTabSel.SistemaId), {CantidadPisos: Self.Value})
                              Título: ="¿Cuántos pisos?"
                              Visible: =(cmpCarddrpTipoCotización_MZL.Selected.Value = "Diseño" || cmpCarddrpTipoCotización_MZL.Selected.Value = "Planos/diseño de cliente")
