                            colTabs,
                            {
                                SistemaId: p.SistemaID,
                                SistemaCotizacionID: p.ID,
                                TipoKey: _tipo,
                                TipoNombre: p.Title,
                                ListaDestino: LookUp(colCatalogoSistemas, TipoKey = _tipo, ListaDestino),
                                TipoIndex: CountRows(Filter(colPuentesHidratacion, Title = p.Title && ID <= p.ID)),
                                NombreSistema: _nombre
