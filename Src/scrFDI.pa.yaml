                Clear(colTabs),
                Clear(colPuenteGuardado),
                Clear(colSEL_Draft),
                Clear(colDIN_Draft),
                Clear(colPBK_Draft),
                Clear(colDRV_Draft),
                Clear(colCAN_Draft),
                Clear(colMEZ_Draft),
                Clear(colCFL_Draft),
                Clear(colMZL_Draft),
                Clear(colOT_Draft),
                Clear(colListadoPiezas),
                Clear(colListadoTarimas),
                Clear(colMEZ_Productos),
                Clear(colCFL_Productos),
                Clear(colMZL_Productos),
                Clear(colElementoSeguridad),
                Clear(colPiezasEspeciales),
                Clear(colProveedoresExternos),
                Clear(colListadoColores)
            );
