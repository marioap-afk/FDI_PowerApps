                        );
                        ForAll(
                            Filter('Hija Piezas Especiales', SistemaCotizaciónID.Id = p.ID) As r,
                            Collect(colPiezasEspeciales, {RowId: r.RowID, Orden: r.Orden, SistemaId: p.SistemaID, Pieza: r.Pieza, Cantidad: r.Cantidad, Comentario: r.Comentarios, Proveedor: r.Proveedor})
                        );
                        ForAll(
                            Filter('Hija Proveedores Externos', SistemaCotizaciónID.Id = p.ID) As r,
                            Collect(colProveedoresExternos, {RowId: r.RowID, Orden: r.Orden, SistemaId: p.SistemaID, Proveedor: r.Proveedor, Alcance: r.Alcance})
                        );
                        ForAll(
                            Filter('Hija Colores', SistemaCotizaciónID.Id = p.ID) As r,
                            Collect(colListadoColores, {RowId: r.RowID, Orden: r.Orden, SistemaId: p.SistemaID, Pieza: r.Pieza, Color: r.ColorNombre, ColorKey: r.ColorKey, Elemento: r.Elemento})
                        );
                        ForAll(
                            Filter('Hija Listado Piezas', SistemaCotizaciónID.Id = p.ID) As r,
                            Collect(colListadoPiezas, {RowId: r.RowID, Orden: r.Orden, SistemaId: p.SistemaID, Pieza: r.Pieza, Comentarios: r.Comentarios})
                        )
                    )
                );
                If(CountRows(colTabs) > 0, UpdateContext({locTabSel: First(colTabs)}))
            );
            //Se crea la variable que dice qué container se muestra
            Set(varCorreoSnap, If(!IsBlank(varCotizacionDraft), Coalesce(varCotizacionDraft.'Correo empresarial', ""), ""));
            Set(varCorreoEditado, false);
            Set(varTelSnap, If(!IsBlank(varCotizacionDraft), Coalesce(varCotizacionDraft.'Número de teléfono', ""), ""));
            Set(varTelEditado, false)
        )
    Children:
      - cntScrFDI:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =ColorValue(varTheme.FondoHex)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutOverflowY: =LayoutOverflow.Scroll
            LayoutWrap: =true
            PaddingBottom: =If(scrFDI.Size = ScreenSize.Small, 8, 16)
            PaddingLeft: =If(scrFDI.Size = ScreenSize.Small, 8, 16)
            PaddingRight: =If(scrFDI.Size = ScreenSize.Small, 8, 16)
            PaddingTop: =If(scrFDI.Size = ScreenSize.Small, 8, 16)
            Width: =Parent.Width
          Children:
            - cmpEncabezadoScrFDI:
                Control: CanvasComponent
                ComponentName: cmpEncabezado
                Properties:
                  Height: =68
                  LayoutMinWidth: =100
                  Width: =Parent.Width
            - MainContainer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                  BorderThickness: =1
                  DropShadow: =DropShadow.Light
                  Fill: =ColorValue(varTheme.SuperficieHex)
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =16
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  LayoutWrap: =true
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - CotizacionesContainer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMaxWidth: |+
                          =0

                        LayoutMinHeight: =16
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Visible: |-
                          =//Muestra el container si la variable está en "Cotización"
                          varVista = "Cotización"
                      Children:
                        - lblErroresFDIResumen:
                            Control: Label@2.5.1
                            Properties:
                              Align: =%Align.RESERVED%.Left
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              BorderColor: =RGBA(250, 191, 0, 1)
                              BorderStyle: =%BorderStyle.RESERVED%.Solid
                              BorderThickness: =1
                              Color: =ColorValue(varTheme.TextoSuaveHex)
                              DisabledColor: =RGBA(186, 186, 186, 1)
                              Fill: =RGBA(255, 244, 206, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =16
                              Live: =%Live.RESERVED%.Off
                              Overflow: =%Overflow.RESERVED%.Hidden
                              PaddingBottom: =10
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =10
                              Role: =%TextRole.RESERVED%.Default
                              Text: =""
                              VerticalAlign: =%VerticalAlign.RESERVED%.Middle
                              Visible: =false
                              Width: =Parent.Width
                        - CotizaciónForm:
                            Control: Form@2.4.4
                            Variant: Classic
                            Layout: Vertical
                            Properties:
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DataSource: ='Cotizaciones 2026'
                              DefaultMode: =FormMode.New
                              Item: =varCotizacionDraft
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              NumberOfColumns: =1
                              OnFailure: |-
                                =Notify(
                                    Coalesce(CotizaciónForm.Error, "Revisa los campos obligatorios del formulario principal."),
                                    NotificationType.Error
                                );
                                Set(varEnviando, false)
                              OnSuccess: |-
                                =// ======================================================
                                // CotizaciónForm.OnSuccess
                                // - Upsert de puente, detalle normalizado e hijas por SistemaCotizaciónID
                                // ======================================================

                                Set(varCotizacionFinal, CotizaciónForm.LastSubmit);
                                Set(varFolioFinal, Coalesce(varCotizacionFinal.Folio, varFolioGenerado));

                                Refresh('Sistemas por cotización');
                                ClearCollect(
                                    colPuentesExistentes,
                                    Filter('Sistemas por cotización', CotizaciónID.Id = varCotizacionFinal.ID)
                                );
                                Clear(colPuenteGuardado);

                                ForAll(
                                    colTabs As t,
                                    With(
                                        {
                                            _puenteExistente: LookUp(
                                                colPuentesExistentes,
                                                ID = Coalesce(t.SistemaCotizacionID, -1)
                                            ),
                                            _puentePorSistema: LookUp(
                                                colPuentesExistentes,
                                                SistemaID = t.SistemaId
                                            )
                                        },
                                        With(
                                            {
                                                recPuente: Patch(
                                                    'Sistemas por cotización',
                                                    If(
                                                        !IsBlank(_puenteExistente),
                                                        _puenteExistente,
                                                        If(!IsBlank(_puentePorSistema), _puentePorSistema, Defaults('Sistemas por cotización'))
                                                    ),
                                                    {
                                                        CotizaciónID: { Id: varCotizacionFinal.ID, Value: varFolioFinal },
                                                        Folio: varFolioFinal,
                                                        Title: t.TipoNombre,
                                                        Nombre: t.NombreSistema,
                                                        SistemaID: t.SistemaId
                                                    }
                                                )
                                            },
                                            Collect(
                                                colPuenteGuardado,
                                                {
                                                    PuenteID: recPuente.ID,
                                                    Sistema: recPuente.Title,
                                                    Nombre: recPuente.Nombre,
                                                    SistemaIdLocal: t.SistemaId,
                                                    TipoKey: t.TipoKey,
                                                    TipoNombre: t.TipoNombre,
                                                    ListaDestino: t.ListaDestino
                                                }
                                            )
                                        )
                                    )
                                );

                                // Borrar sistemas que existían en SharePoint y ya no están en los tabs locales.
                                ForAll(
                                    colPuentesExistentes As oldPuente,
                                    If(
                                        IsBlank(LookUp(colPuenteGuardado, PuenteID = oldPuente.ID)),
                                        With(
                                            {
                                                _oldId: oldPuente.ID,
                                                _oldTipo: Switch(
                                                    oldPuente.Title,
                                                    "Selectivo", "SEL",
                                                    "Dinámico", "DIN",
                                                    "Pushback", "PBK",
                                                    "Drive In", "DRV",
                                                    "Cantiléver", "CAN",
                                                    "Mezzanine", "MEZ",
                                                    "Carton Flow", "CFL",
                                                    "Mezzanine Limpio", "MZL",
                                                    "Otro", "OT",
                                                    ""
                                                )
                                            },
                                            ForAll(Filter('Hija Tarimas', SistemaCotizaciónID.Id = _oldId) As r, Remove('Hija Tarimas', r));
                                            ForAll(Filter('Hija Productos', SistemaCotizaciónID.Id = _oldId) As r, Remove('Hija Productos', r));
                                            ForAll(Filter('Hija Colores', SistemaCotizaciónID.Id = _oldId) As r, Remove('Hija Colores', r));
                                            ForAll(Filter('Hija Elementos Seguridad', SistemaCotizaciónID.Id = _oldId) As r, Remove('Hija Elementos Seguridad', r));
                                            ForAll(Filter('Hija Piezas Especiales', SistemaCotizaciónID.Id = _oldId) As r, Remove('Hija Piezas Especiales', r));
                                            ForAll(Filter('Hija Proveedores Externos', SistemaCotizaciónID.Id = _oldId) As r, Remove('Hija Proveedores Externos', r));
                                            ForAll(Filter('Hija Listado Piezas', SistemaCotizaciónID.Id = _oldId) As r, Remove('Hija Listado Piezas', r));
                                            Switch(
                                                _oldTipo,
                                                "SEL", ForAll(Filter('Sistema Selectivo', SistemaCotizaciónID.Id = _oldId) As r, Remove('Sistema Selectivo', r)),
                                                "DIN", ForAll(Filter('Sistema Dinámico', SistemaCotizaciónID.Id = _oldId) As r, Remove('Sistema Dinámico', r)),
                                                "PBK", ForAll(Filter('Sistema Pushback', SistemaCotizaciónID.Id = _oldId) As r, Remove('Sistema Pushback', r)),
                                                "DRV", ForAll(Filter('Sistema Drive In', SistemaCotizaciónID.Id = _oldId) As r, Remove('Sistema Drive In', r)),
                                                "CAN", ForAll(Filter('Sistema Cantiliver', SistemaCotizaciónID.Id = _oldId) As r, Remove('Sistema Cantiliver', r)),
                                                "MEZ", ForAll(Filter('Sistema Mezzanine', SistemaCotizaciónID.Id = _oldId) As r, Remove('Sistema Mezzanine', r)),
                                                "CFL", ForAll(Filter('Sistema Carton Flow', SistemaCotizaciónID.Id = _oldId) As r, Remove('Sistema Carton Flow', r)),
                                                "MZL", ForAll(Filter('Sistema Mezzanine Limpio', SistemaCotizaciónID.Id = _oldId) As r, Remove('Sistema Mezzanine Limpio', r)),
                                                "OT", ForAll(Filter('Sistema Otro', SistemaID.Id = _oldId) As r, Remove('Sistema Otro', r))
                                            );
                                            Remove('Sistemas por cotización', oldPuente)
                                        )
                                    )
                                );

                                ClearCollect(colSistemasGuardar, colSEL_Draft);
                                Collect(colSistemasGuardar, colDIN_Draft);
                                Collect(colSistemasGuardar, colPBK_Draft);
                                Collect(colSistemasGuardar, colDRV_Draft);
                                Collect(colSistemasGuardar, colCAN_Draft);
                                Collect(colSistemasGuardar, colMEZ_Draft);
                                Collect(colSistemasGuardar, colCFL_Draft);
                                Collect(colSistemasGuardar, colMZL_Draft);

                                ForAll(
                                    colSistemasGuardar As s,
                                    With(
                                        {
                                            _puente: LookUp(colPuenteGuardado, SistemaIdLocal = s.SistemaId),
                                            _folio: varFolioFinal,
                                            _acabado: Coalesce(s.Acabado, "Pintado"),
                                            _tipoDiseno: If(s.TipoDiseño = "Cotización o pedido anterior", "Pedido o cotización anterior", Coalesce(s.TipoDiseño, "Diseño"))
                                        },
                                        With(
                                            {
                                                _cotLookup: { Id: varCotizacionFinal.ID, Value: _folio },
                                                _sisLookup: { Id: _puente.PuenteID, Value: _puente.Sistema },
                                                _esGalv: Lower(_acabado) <> "pintado" && !IsBlank(_acabado),
                                                _tipoGalv: Switch(
                                                    Lower(_acabado),
                                                    "galvanizado en frío", "Frio",
                                                    "galvanizado en frio", "Frio",
                                                    "galvanizado en caliente", "Caliente",
                                                    "pregalvanizado", "Pregalvanizado",
                                                    Blank()
                                                )
                                            },
                                            Switch(
                                                s.TipoKey,
                                                "SEL",
                                                With(
                                                    {_detail: LookUp('Sistema Selectivo', SistemaCotizaciónID.Id = _puente.PuenteID)},
                                                    Patch(
                                                        'Sistema Selectivo',
                                                        If(IsBlank(_detail), Defaults('Sistema Selectivo'), _detail),
                                                        {
                                                            CotizaciónID: _cotLookup,
                                                            SistemaCotizaciónID: _sisLookup,
                                                            Folio: _folio,
                                                            Title: s.NombreSistema,
                                                            NombreSistema: s.NombreSistema,
                                                            'Tipo de diseño': If(IsBlank(_tipoDiseno), Blank(), {Value: _tipoDiseno}),
                                                            'Folio de cotización anteriro': s.FolioCotizacionAnterior,
                                                            'Folio de pedido anterior': s.FolioPedidoAnterior,
                                                            'Comentarios / alcance de la referencia': s.ComentariosReferencia,
                                                            Acabado: {Value: _acabado},
                                                            Galvanizado: _esGalv,
