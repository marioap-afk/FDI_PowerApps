                        );
                        ForAll(
                            Filter('Hija Productos', SistemaCotizaciónID.Id = p.ID) As r,
                            If(
                                _tipo = "CFL",
                                Collect(colCFL_Productos, {RowId: r.RowID, Orden: r.Orden, SistemaId: p.SistemaID, TipoProducto: r.'Tipo producto', LargoProducto: r.'Largo producto', AnchoProducto: r.'Ancho producto', AltoProducto: r.'Alto producto', PesoProducto: r.'Peso producto', CantidadPorNivel: r.'Cantidad por nivel'}),
                                If(
                                    _tipo = "MZL",
                                    Collect(colMZL_Productos, {RowId: r.RowID, Orden: r.Orden, SistemaId: p.SistemaID, TipoProducto: r.'Tipo producto', LargoProducto: r.'Largo producto', AnchoProducto: r.'Ancho producto', AltoProducto: r.'Alto producto', PesoProducto: r.'Peso producto', CantidadPorNivel: r.'Cantidad por nivel'}),
                                    Collect(colMEZ_Productos, {RowId: r.RowID, Orden: r.Orden, SistemaId: p.SistemaID, TipoProducto: r.'Tipo producto', LargoProducto: r.'Largo producto', AnchoProducto: r.'Ancho producto', AltoProducto: r.'Alto producto', PesoProducto: r.'Peso producto', CantidadPorNivel: r.'Cantidad por nivel'})
                                )
                            )
