                                      IsBlank(varFolioRow),
                                      Set(
                                          varFolioRow,
                                          Patch(
                                              'Folios cotizaciones',
                                              Defaults('Folios cotizaciones'),
                                              {
                                                  Año: varAnioActual,
                                                  Title: 0
                                              }
                                          )
                                      );
                                      Refresh('Folios cotizaciones');
                                      Set(
                                          varFolioRow,
                                          LookUp(
                                              'Folios cotizaciones',
                                              Año = varAnioActual
                                          )
                                      )
                                  );
                                  Set(
                                      varSiguienteNumero,
                                      Value(varFolioRow.Title) + 1
                                  );
                                  Set(
                                      varFolioGenerado,
                                      Text(varSiguienteNumero, "000") & "-" & Text(varAnioActual, "00")
                                  );
                                  SubmitForm(CotizaciónForm),
                                  Set(varEnviando, false);
                                  Notify(
                                      "No se pudo iniciar el envío de la solicitud. Revisa la cotización e intenta nuevamente.",
                                      NotificationType.Error
                                  )
                              )
                          )
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =varTheme.ControlRadius
                        RadiusBottomRight: =varTheme.ControlRadius
                        RadiusTopLeft: =varTheme.ControlRadius
                        RadiusTopRight: =varTheme.ControlRadius
                        Size: |-
                          =If(
                              App.Width < 600,
                              12,
                              If(App.Width < 1024, 14, 16)
                          )
                        Text: ="Enviar solicitud"
                        Width: |
                          =Parent.Width/3-20
                        X: =40
                        Y: =40
