Screens:
  scrFDI:
    Properties:
      Fill: =ColorValue(varTheme.FondoHex)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =If(
            Coalesce(varFDIRetornarSistemas, false),
            Set(varFDIRetornarSistemas, false);
            Set(varVista, "Sistemas");
            UpdateContext({ctxShowMenu: false}),
            // Vista inicial
            Set(varVista, "Cotización");
            UpdateContext({ ctxShowMenu: false, locDirClienteSeleccionado: false, locDirSnapshot: Blank()});
            //Crea la variable varCotizacionDraft, si existe un registro creado por el usuario como borrador, la variable es True y el form de cotización es un Edit de ese registro que está como borrador
            Set( varCotizacionDraft, LookUp( 'Cotizaciones 2026', Created >= DateAdd(Today(), -18, TimeUnit.Months) && Estado.Value = "Borrador" && 'Created By'.Email = User().Email ) );
            If( !IsBlank(varCotizacionDraft), EditForm(CotizaciónForm), NewForm(CotizaciónForm) );
            If(
                !IsBlank(varCotizacionDraft) && !IsBlank(varCotizacionDraft.EmpresaLookUp),
                With(
                    { _clientePorId: LookUp(Clientes, ID = varCotizacionDraft.EmpresaLookUp.Id) },
                    Set(
                        varClienteSel,
                        If(
                            !IsBlank(_clientePorId),
                            _clientePorId,
                            LookUp(Clientes, Title = varCotizacionDraft.EmpresaLookUp.Value)
                        )
                    )
                ),
                Set(varClienteSel, Blank())
            );
            If(
                !IsBlank(varCotizacionDraft) && !IsBlank(varCotizacionDraft.ContactoLookUp),
                Set(varContactoSel, varCotizacionDraft.ContactoLookUp.Value);
                Set(varContactoFull, LookUp(Contactos, Title = varCotizacionDraft.ContactoLookUp.Value));
                Set(varContactoId, varContactoFull.ID),
                Set(varContactoSel, "");
                Set(varContactoFull, Blank());
                Set(varContactoId, Blank())
            );
