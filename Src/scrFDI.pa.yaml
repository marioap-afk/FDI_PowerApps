                                p.Title,
                                "Selectivo", "SEL",
                                "Dinámico", "DIN",
                                "Pushback", "PBK",
                                "Drive In", "DRV",
                                "Cantiléver", "CAN",
                                "Mezzanine", "MEZ",
                                "Carton Flow", "CFL",
                                "Mezzanine Limpio", "MZL",
                                "Otro", "OT",
                                ""
                            ),
