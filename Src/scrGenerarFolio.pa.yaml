                        - cntBotones:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =50
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinWidth: =0
                              PaddingBottom: =10
                              PaddingLeft: =8
                              PaddingRight: =24
                              PaddingTop: =10
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - cmpbtnBodySecCancelar:
                                  Control: CanvasComponent
                                  ComponentName: cmpbtnBodySec
                                  Properties:
                                    DisplayMode: =DisplayMode.Edit
                                    Height: =40
                                    OnSelect: =ResetForm(FormFolio)
                                    Text: ="Cancelar"
                                    Width: =140
                              - cmpbtnBodyGenerarFolio:
                                  Control: CanvasComponent
                                  ComponentName: cmpbtnBody
                                  Properties:
                                    DisplayMode: =DisplayMode.Edit
                                    Height: =40
                                    OnSelect: |+
                                      =// ======================================================
                                      // BOTÓN ENVIAR SOLICITUD
                                      // Responsabilidad:
                                      // - Evitar doble envío
                                      // - Preparar folio (SIN confirmar contador)
                                      // - Enviar el formulario principal (SubmitForm)
                                      // ======================================================

                                      If(
                                          // --------------------------------------------------
                                          // Si ya se está enviando, solo avisar y no repetir
                                          // --------------------------------------------------
                                          varEnviando2,
                                          Notify(
                                              "La solicitud ya se está enviando...",
                                              NotificationType.Information
                                          ),

                                          // --------------------------------------------------
                                          // Si NO se está enviando, iniciar proceso
                                          // --------------------------------------------------
                                          Set(varEnviando2, true);

                                          // --------------------------------------------------
                                          // Refrescar lista de folios (evita usar datos en caché)
                                          // --------------------------------------------------
                                          Refresh('Folios cotizaciones');

                                          // --------------------------------------------------
                                          // Obtener el año actual en formato de 2 dígitos (ej. 26)
                                          // --------------------------------------------------
                                          Set(
                                              varAnioActual2,
                                              Mod((Text(Year(Today()), "00")),100)
                                          );

                                          // --------------------------------------------------
                                          // Buscar el registro del año en la lista de folios
                                          // --------------------------------------------------
                                          Set(
                                              varFolioRow2,
                                              LookUp(
                                                  'Folios cotizaciones',
                                                  Año = varAnioActual2
                                              )
                                          );

                                          // --------------------------------------------------
                                          // Si no existe registro para ese año, crearlo con Title = 0
                                          // (aún NO incrementamos nada)
                                          // --------------------------------------------------
                                          If(
                                              IsBlank(varFolioRow2),
                                              Set(
                                                  varFolioRow2,
                                                  Patch(
                                                      'Folios cotizaciones',
                                                      Defaults('Folios cotizaciones'),
                                                      {
                                                          Año: varAnioActual2,
                                                          Title: 0
                                                      }
                                                  )
                                              );
                                              Refresh('Folios cotizaciones');
                                              Set(
                                                  varFolioRow2,
                                                  LookUp(
                                                      'Folios cotizaciones',
                                                      Año = varAnioActual2
                                                  )
                                              )
                                          );

                                          // --------------------------------------------------
                                          // Calcular el siguiente número de folio (SOLO en memoria)
                                          // --------------------------------------------------
                                          Set(
                                              varSiguienteNumero2,
                                              Value(varFolioRow2.Title) + 1
                                          );

                                          // --------------------------------------------------
                                          // Construir el folio final con formato ###-AA (ej. 001-26)
                                          // --------------------------------------------------
                                          Set(
                                              varFolioGenerado2,
                                              Text(varSiguienteNumero2, "000") & "-" & Text(varAnioActual2, "00")
                                          );

                                          // --------------------------------------------------
                                          // Enviar el formulario principal de cotización
                                          // IMPORTANTE:
                                          // - El campo Folio del form debe tomar varFolioGenerado
                                          // - El guardado real continúa en CotizaciónForm.OnSuccess
                                          // --------------------------------------------------

                                          SubmitForm(FormFolio);
                                          Set(varEnviando2, false)
                                      )

                                    Text: ="Generar fólio"
                                    Width: =140
