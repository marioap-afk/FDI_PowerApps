Screens:
  scrGenerarFolio:
    Properties:
      Fill: =ColorValue(varTheme.FondoHex)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =//Crea la variable varCotizacionDraft, si existe un registro creado por el usuario como borrador, la variable es True y el form de cotización es un Edit de ese registro que está como borrador
        Set(
            varCotizacionDraft2,
            LookUp(
                'Cotizaciones 2026',
                Estado.Value = "Borrador" && 'Created By'.Email = User().Email
            )
        );

        If(
            !IsBlank(varCotizacionDraft2),
            EditForm(FormFolio),
            NewForm(FormFolio)
        );

        Set(varCorreoSnap2, "");
        Set(varCorreoEditado2, false);

        Set(varTelSnap2, "");
        Set(varTelEditado2, false);

        Set(varMostrarPopup, false);

        Set(varScreen, "Generar cotización")
