                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              PaddingBottom: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =16
                              Width: =Parent.Width - 32
                              Y: =199
                            Children:
                              - cntListadoTarimasHeaderDRV:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =ColorValue(varTheme.BordeHex)
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =ColorValue(varTheme.HeaderTablaHex)
                                    FillPortions: =0
                                    Height: =varTheme.HeaderHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
