                                      =Collect(
                                          colListadoPiezas,
                                          {
                                              RowId: GUID(),
                                              SistemaId: locTabSel.SistemaId,
                                              Pieza: "",
                                              Comentarios: ""
                                          }
                                      );
                                    Text: ="Agregar"
                                    Width: =120
                        - cntListadoDePiezasHeaderDRV:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =ColorValue(varTheme.BordeHex)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =ColorValue(varTheme.HeaderTablaHex)
                              FillPortions: =0
                              Height: =varTheme.HeaderHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =16
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =16
                              PaddingRight: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                            Children:
                              - lblPiezaHeaderDRV:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Pieza"
                                    Width: =Max(260, Min(420, Parent.Width * 0.32))
                              - lblComentarioHeaderDRV:
                                  Control: Label@2.5.1
