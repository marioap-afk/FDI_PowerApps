                        BorderThickness: =1
                        DropShadow: =varTheme.Sombra
                        Fill: =ColorValue(varTheme.SuperficieHex)
                        RadiusBottomLeft: =varTheme.CardRadius
                        RadiusBottomRight: =varTheme.CardRadius
                        RadiusTopLeft: =varTheme.CardRadius
                        RadiusTopRight: =varTheme.CardRadius
                        FillPortions: =0
                        Height: =cntListadoDePiezasBotonesDRV.Height+cntListadoDePiezasHeaderDRV.Height+galListadoDePiezasDRV.Height+32
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        Visible: =cmpCarddrpTipoCotización_DRV.Selected.Value = "Listado de piezas"
                        Width: =Parent.Width - 32
                        X: =16
                        Y: =40
                      Children:
                        - cntListadoDePiezasBotonesDRV:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingLeft: =2
                              PaddingRight: =2
                            Children:
                              - lblListadoDePiezasDRV:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =16
                                    TabIndex: =0
                                    Text: ="Listado de piezas"
                                    Width: =Parent.Width - btnAgregarPiezaDRV.Width - 24
                              - btnAgregarPiezaDRV:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="btn Agregar Pieza DRV"
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Height: =36
                                    Icon: ="Add"
                                    Layout: ='ButtonCanvas.Layout'.IconBefore
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
