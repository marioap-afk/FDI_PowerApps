                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =ColorValue(varTheme.TextoSuaveHex)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: ="Pieza"
                                    Visible: =false
                                    Width: =ComentarioInput_DRV.Width
                                    X: =ComentarioInput_DRV.X
                                    Y: =8
                              - Separator2_DRV:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Fill: =RGBA(237, 235, 233, 1)
                                    Height: =1
                                    OnSelect: =Select(Parent)
                                    Width: =Parent.TemplateWidth
                                    Y: =Parent.TemplateHeight - Self.Height
                  - cntDiseñoDRV:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: |-
                          =If(
                              cmpCarddrpTipoCotización_DRV.Selected.Value = "Planos/diseño de cliente",
                              cntTarimasDRV.Height + 32,
                              Max(
                                  560,
                                  cntTarimasDRV.Height +
                                  cmpTxtHuellaTarimaDRV.Height +
                                  cntSectionConfigRackDRV.Height +
                                  cmpTxtFrentesBuscadosDRV.Height +
                                  cmpTxtFondosBuscadosDRV.Height +
                                  cmpTxtNivelesBuscadosDRV.Height +
                                  cntSectionAreaPasillosDRV.Height +
                                  cmpTxtPasilloMaxDRV.Height +
                                  cmpTxtPasilloMinDRV.Height +
                                  cmpTxtAnchoDispDRV.Height +
                                  cmpTxtLargoDispDRV.Height +
                                  cntSectionMontacargasDRV.Height +
                                  cmpCarddrpTipoCapturaMontacargasDRV.Height +
                                  If(cmpTxtAlturaCabinaMontacargasDRV.Visible, cmpTxtAlturaCabinaMontacargasDRV.Height, 0) +
                                  If(cmpTxtAnchoTotalMontacargasDRV.Visible, cmpTxtAnchoTotalMontacargasDRV.Height, 0) +
                                  If(cmpTxtAnchoMastilMontacargasDRV.Visible, cmpTxtAnchoMastilMontacargasDRV.Height, 0) +
                                  If(imgMontacargasMedidasDRV.Visible, imgMontacargasMedidasDRV.Height, 0) +
                                  If(cmpTxtModeloMontacargasDRV.Visible, cmpTxtModeloMontacargasDRV.Height, 0) +
                                  cntSectionCriteriosNivelesDRV.Height +
                                  cmpCardTglAlturaMontacargasDRV.Height +
                                  If(cmpTxtAlturaMaxMontacargasDRV.Visible, cmpTxtAlturaMaxMontacargasDRV.Height, 0) +
                                  cmpCardTglAlturaNaveDRV.Height +
                                  If(cmpTxtAlturaMaxNaveDRV.Visible, cmpTxtAlturaMaxNaveDRV.Height, 0) +
                                  If(cmpTxtAlturaMinNaveDRV.Visible, cmpTxtAlturaMinNaveDRV.Height, 0) +
                                  cmpCardTglAdjuntarImagenLayoutDRV.Height +
                                  If(lblAdjuntarArchivosDRV.Visible, lblAdjuntarArchivosDRV.Height, 0) +
                                  cmpCardTglDefClienteDRV.Height +
                                  If(cmpTxtComentariosConfigClienteDRV.Visible, cmpTxtComentariosConfigClienteDRV.Height, 0) +
                                  cntSectionSeguridadDRV.Height +
                                  cmpCardTglElementosSeguridadDRV.Height +
                                  If(cntElementosSeguridadDRV.Visible, cntElementosSeguridadDRV.Height, 0) +
                                  cntSectionPiezasEspecialesDRV.Height +
