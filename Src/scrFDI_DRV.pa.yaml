Screens:
  scrFDI_DRV:
    Properties:
      Fill: =ColorValue(varTheme.FondoHex)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(varVista, "Sistemas");
        If(
            IsBlank(locTabSel) && CountRows(Filter(colTabs, TipoKey = "DRV")) > 0,
            UpdateContext({locTabSel: First(Filter(colTabs, TipoKey = "DRV"))})
        );
        Set(varDraftActual, LookUp(colDRV_Draft, SistemaId = locTabSel.SistemaId))
    Children:
      - cntFDISistemaDRV:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =ColorValue(varTheme.FondoHex)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(scrFDI_DRV.Size = ScreenSize.Small, 8, 16)
            PaddingLeft: =If(scrFDI_DRV.Size = ScreenSize.Small, 8, 16)
            PaddingRight: =If(scrFDI_DRV.Size = ScreenSize.Small, 8, 16)
            PaddingTop: =If(scrFDI_DRV.Size = ScreenSize.Small, 8, 16)
            Width: =Parent.Width
          Children:
            - cntFDISistemaBarDRV:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                  BorderThickness: =1
                  DropShadow: =varTheme.Sombra
                  Fill: =ColorValue(varTheme.SuperficieHex)
                  RadiusBottomLeft: =varTheme.CardRadius
                  RadiusBottomRight: =varTheme.CardRadius
                  RadiusTopLeft: =varTheme.CardRadius
                  RadiusTopRight: =varTheme.CardRadius
                  FillPortions: =0
                  Height: =If(scrFDI_DRV.Size = ScreenSize.Small, 52, 60)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =44
                  LayoutMinWidth: =0
                  PaddingBottom: =6
                  PaddingLeft: =If(scrFDI_DRV.Size = ScreenSize.Small, 8, 12)
                  PaddingRight: =If(scrFDI_DRV.Size = ScreenSize.Small, 8, 12)
                  PaddingTop: =6
                Children:
                  - icoFDISistemaVolverDRV:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Volver"
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =ColorValue(varTheme.PrimarioHex)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Height: =If(scrFDI_DRV.Size = ScreenSize.Small, 36, 40)
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(16, 110, 190, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.BackArrow
                        OnSelect: |-
                          =Set(varFDIRetornarSistemas, true);
                          Navigate(scrFDI, ScreenTransition.None, {locTabSel: locTabSel})
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(16, 110, 190, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        TabIndex: =0
                        Tooltip: ="Volver"
                        Width: =If(scrFDI_DRV.Size = ScreenSize.Small, 36, 40)
                  - lblFDISistemaTituloDRV:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =ColorValue(varTheme.TextoHex)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height - 12
                        LayoutMinWidth: =0
                        Size: =If(scrFDI_DRV.Size = ScreenSize.Small, varTheme.Label, varTheme.H3)
                        Text: =Coalesce(locTabSel.NombreSistema, "Drive In")
                        Width: =Max(0, Parent.Width - icoFDISistemaVolverDRV.Width - 24)
                        Wrap: =false
            - cntDRV:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  Visible: =CountRows(colTabs) > 0 && Coalesce(locTabSel.TipoKey, "") = "DRV"
                  Width: =Parent.Width
                  X: =40
                  Y: =40
                Children:
                  - cmpCarddrpTipoCotización_DRV:
                      Control: CanvasComponent
                      ComponentName: cmpCarddrp
                      Properties:
                        DefaultSelectedItem: |-
                          =With(
                              {_valor: varDraftActual.MetodoCaptura},
                              If(
                                  IsBlank(_valor),
                                  Blank(),
                                  LookUp(cmpCarddrpTipoCotización_DRV.Items, Value = _valor)
                              )
                          )
                        Height: =60
                        Items: |-
                          =Table(
                              {Value: "Diseño"},
                              {Value: "Listado de piezas"},
                              {Value: "Planos/diseño de cliente"},
                              {Value: "Cotización o pedido anterior"}
                          )
                        OnChange: |-
                          =Patch(
                              colDRV_Draft,
                              LookUp(colDRV_Draft, SistemaId = locTabSel.SistemaId),
                              {
                                  MetodoCaptura: Self.Selected.Value,
                                  TipoDiseño: Self.Selected.Value
                              }
                          )
                        Título: ="Método de captura"
                  - cntListadoDePiezasDRV:
