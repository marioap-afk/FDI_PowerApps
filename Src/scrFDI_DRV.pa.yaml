                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Comentario"
                                    Width: =Max(360, Parent.Width - lblPiezaHeaderDRV.Width - lblAccionHeaderDRV.Width - 64)
                              - lblAccionHeaderDRV:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =ColorValue(varTheme.TextoHex)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =11
                                    TabIndex: =0
                                    Text: ="Acción"
                                    Width: =64
                        - galListadoDePiezasDRV:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextVariant_ver5.0
                            Properties:
                              AccessibleLabel: ="gal Listado De Piezas DRV"
                              BorderColor: =ColorValue(varTheme.BordeSuaveHex)
                              BorderThickness: =1
                              FillPortions: =0
                              Height: =If(CountRows(Self.AllItems)=0,0,Min(galListadoDePiezasDRV.TemplateHeight*CountRows(Self.AllItems),420))
                              Items: |-
                                =Filter(
                                    colListadoPiezas,
                                    SistemaId = locTabSel.SistemaId
                                )
                              LayoutMinHeight: =16
                              Selectable: =false
                              TabIndex: =0
                              TemplateSize: =varTheme.RowHeight
                            Children:
                              - BorrarPiezaButton_DRV:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Borrar Pieza Button"
                                    Align: =Align.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    Height: =36
                                    Icon: ="Delete"
                                    OnSelect: =Remove(colListadoPiezas, ThisItem)
                                    Text: =""
                                    Width: =44
                                    X: =Parent.TemplateWidth - Self.Width - 16
                                    Y: =12
                              - ComentarioInput_DRV:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Comentario Input"
                                    BorderColor: =ColorValue(varTheme.BordeHex)
                                    BorderThickness: =1
                                    Color: =ColorValue(varTheme.TextoHex)
                                    Default: =ThisItem.Pieza
                                    DelayOutput: =true
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    HoverBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    HoverColor: =ColorValue(varTheme.TextoHex)
                                    HoverFill: =ColorValue(varTheme.SuperficieHex)
                                    OnChange: |-
                                      =Patch(
                                          colListadoPiezas,
                                          ThisItem,
                                          {
                                              Pieza: Self.Text
                                          }
                                      )
                                    PressedBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    PressedColor: =ColorValue(varTheme.TextoHex)
                                    PressedFill: =ColorValue(varTheme.SuperficieHex)
                                    RadiusBottomLeft: =varTheme.ControlRadius
                                    RadiusBottomRight: =varTheme.ControlRadius
                                    RadiusTopLeft: =varTheme.ControlRadius
                                    RadiusTopRight: =varTheme.ControlRadius
                                    Width: =Max(260, Min(420, Parent.TemplateWidth * 0.32))
                                    X: =16
                                    Y: =12
                              - PiezaInput_DRV:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    AccessibleLabel: ="Pieza Input"
                                    BorderColor: =ColorValue(varTheme.BordeHex)
                                    BorderThickness: =1
                                    Color: =ColorValue(varTheme.TextoHex)
                                    Default: =ThisItem.Comentarios
                                    DelayOutput: =true
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisabledFill: =RGBA(242, 242, 241, 0)
                                    Font: =Font.'Segoe UI'
                                    Height: =36
                                    HoverBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    HoverColor: =ColorValue(varTheme.TextoHex)
                                    HoverFill: =ColorValue(varTheme.SuperficieHex)
                                    Mode: =TextMode.MultiLine
                                    OnChange: |-
                                      =Patch(
                                          colListadoPiezas,
                                          ThisItem,
                                          {
                                              Comentarios: Self.Text
                                          }
                                      )
                                    PressedBorderColor: =ColorValue(varTheme.PrimarioHex)
                                    PressedColor: =ColorValue(varTheme.TextoHex)
                                    PressedFill: =ColorValue(varTheme.SuperficieHex)
