                                    X: =ComentarioInput_DRV.X + ComentarioInput_DRV.Width + 16
                                    Y: =12
                              - ComentarioLabel_DRV:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =ColorValue(varTheme.TextoSuaveHex)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =18
                                    OnSelect: =Select(Parent)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: ="Comentario"
                                    Visible: =false
                                    Width: =PiezaInput_DRV.Width
                                    X: =PiezaInput_DRV.X
                                    Y: =8
