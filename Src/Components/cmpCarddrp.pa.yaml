ComponentDefinitions:
  cmpCarddrp:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      DefaultSelectedItem:
        PropertyKind: Input
        DisplayName: DefaultSelectedItem
        Description: Valor que tendrá el dropdown
        DataType: Record
        Default: |-
          =//With({ _col: colXXX_Draft //Este se cambia };LookUp(_col; SistemaId = locTabSel.SistemaId).XXX //Este se cambia, columna)
          {Value:""} //Se borra
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Valores para el dropdown
        DataType: Table
        Default: =Choices('Sistema Selectivo'.'Tipo de diseño')
      OnChange:
        PropertyKind: Event
        DisplayName: OnChange
        Description: Aquí se hace el patch
        ReturnType: None
        Default: |-
          =//With({_col: colXXX_Draft //Este se cambia};Patch(_col;LookUp(_col; SistemaId = locTabSel.SistemaId);{ XXX : Self.Selected } //Se cambia el nombre de la columna))
      Selected:
        PropertyKind: Output
        DisplayName: Selected
        Description: Propiedad a actualizar en la colección
        DataType: Record
      Título:
        PropertyKind: Input
        DisplayName: Título
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Título"
    Properties:
      Height: =varTheme.FieldHeight
      Selected: =drpcarddrp.Selected
    Children:
      - cntcarddrp:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =4
            PaddingLeft: =4
            PaddingRight: =4
            PaddingTop: =4
            Width: =Parent.Width
          Children:
            - lblcarddrp:
                Control: ModernText@1.0.0
                Properties:
                  FontWeight: =varTheme.LabelEspesor
                  Height: =Self.Size*1.5
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =varTheme.Label
                  Text: =cmpCarddrp.Título
            - drpcarddrp:
                Control: DropDown@0.0.45
                Properties:
                  AccessibleLabel: ="drpcarddrp"
                  DefaultSelectedItems: "=Coalesce(cmpCarddrp.DefaultSelectedItem, Blank())\r\n\r\n        "
                  FontSize: =varTheme.Body
                  Height: =lblcarddrp.Height
                  Items: =cmpCarddrp.Items
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnChange: =cmpCarddrp.OnChange()
