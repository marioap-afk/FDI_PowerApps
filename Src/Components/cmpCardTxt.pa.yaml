ComponentDefinitions:
  cmpCardTxt:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      DefaultValue:
        PropertyKind: Input
        DisplayName: DefaultValue
        Description: Valor que tendrá el dropdown
        DataType: Text
        Default: |
          =//Coalesce(LookUp(colSEL_Draft; SistemaId = locTabSel.SistemaId; AltCritMonta); "" )
      OnChange:
        PropertyKind: Event
        DisplayName: OnChange
        Description: Aquí se hace el patch
        ReturnType: None
        Default: |-
          =//Patch( colSEL_Draft; LookUp(colSEL_Draft; SistemaId = locTabSel.SistemaId); {AltCritMonta: Self.Value} )
      Título:
        PropertyKind: Input
        DisplayName: Título
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Título"
      Value:
        PropertyKind: Output
        DisplayName: Value
        Description: Propiedad a actualizar en la colección
        DataType: Text
    Properties:
      Height: =varTheme.FieldHeight
      Value: =txtCardTxt.Text
    Children:
      - cntCardTxt:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =4
            PaddingLeft: =4
            PaddingRight: =4
            PaddingTop: =4
            Width: =Parent.Width
          Children:
            - lblCardTxt:
                Control: ModernText@1.0.0
                Properties:
                  FontWeight: =varTheme.LabelEspesor
                  Height: =Self.Size*1.5
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =varTheme.Label
                  Text: =cmpCardTxt.Título
            - txtCardTxt:
                Control: ModernTextInput@1.1.0
                Properties:
                  AccessibleLabel: ="txt Card Txt"
                  AlignInContainer: =AlignInContainer.Stretch
                  Default: =cmpCardTxt.DefaultValue
                  Font: =
                  Height: =Self.Size*1.5
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnChange: =cmpCardTxt.OnChange()
                  Size: =varTheme.Body
