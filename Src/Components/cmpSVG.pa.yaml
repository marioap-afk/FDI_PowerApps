ComponentDefinitions:
  cmpSVG:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      AnchoDeBorde:
        PropertyKind: Input
        DisplayName: Ancho de borde
        Description: Propiedad personalizada
        DataType: Number
        Default: =100
      Color:
        PropertyKind: Input
        DisplayName: Color
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Texto"
      ColorDeBorde:
        PropertyKind: Input
        DisplayName: Color de borde
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Texto"
      DataUri:
        PropertyKind: Output
        DisplayName: DataUri
        Description: Propiedad personalizada
        DataType: Text
      SVG:
        PropertyKind: Input
        DisplayName: SVG
        Description: Template de SVG
        DataType: Text
        Default: ="Texto"
    Properties:
      DataUri: |-
        =With(
            {
                _fill: Coalesce(Self.Color, "#0F6CBD"),
                _stroke: Coalesce(Self.ColorDeBorde, ""),
                _strokeWidth: Text(Coalesce(Self.AnchoDeBorde, 0), "[$-en-US]0.###")
            },
            With(
                {
                    _svgApplied:
                        Substitute(
                            Substitute(
                                Substitute(
                                    Self.SVG,
                                    "{{fill}}", _fill
                                ),
                                "{{stroke}}", _stroke
                            ),
                            "{{strokeWidth}}", _strokeWidth
                        )
                },
                "data:image/svg+xml;utf8," & EncodeUrl(_svgApplied)
            )
        )
      Height: =64
      Width: =64
    Children:
      - img:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            BorderThickness: =2
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =Parent.Height
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(0, 0, 0, 0)
            Image: =cmpSVG.DataUri
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(0, 0, 0, 0)
            Width: =Parent.Width
