ComponentDefinitions:
  cmpEncabezado:
    DefinitionType: CanvasComponent
    Description: Encabezado genérico
    AccessAppScope: true
    Properties:
      Height: =68
      Width: =400
    Children:
      - cntEncabezado:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =ColorValue(varTheme.PrimarioHex)
            Height: =68
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =5
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            LayoutWrap: =true
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =6
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - cntBtn:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingLeft: =8
                  PaddingRight: =8
                  X: =40
                  Y: =40
                Children:
                  - btnHome:
                      Control: Button@0.0.45
                      Properties:
                        AccessibleLabel: ="Ir al inicio"
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        BasePaletteColor: =ColorValue(varTheme.PrimarioHex)
                        FontSize: =48
                        Height: =Parent.Height
                        Icon: ="Home"
                        IconStyle: ='ButtonCanvas.IconStyle'.Outline
                        Layout: ='ButtonCanvas.Layout'.IconOnly
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Navigate(scrInicio)
                        Width: =Self.Height
                  - btnBack:
                      Control: Button@0.0.45
                      Properties:
                        AccessibleLabel: ="Volver"
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        FontSize: =48
                        Height: =Parent.Height
                        Icon: ="ChevronLeft"
                        Layout: ='ButtonCanvas.Layout'.IconOnly
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Back()
                        Width: =Self.Height
                  - Text1:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =RGBA(255, 255, 255, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =varScreen
