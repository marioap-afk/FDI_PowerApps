ComponentDefinitions:
  cmplblh1:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      AlineaciónHorizontal:
        PropertyKind: Input
        DisplayName: Alineación horizontal
        Description: Utilizar Align.Left, Align.Center o Align.Right
        DataType: Text
        Default: =Align.Left
      PropiedadPersonalizada1:
        PropertyKind: Event
        DisplayName: Propiedad personalizada 1
        Description: Propiedad personalizada
        ReturnType: None
        Default: =
      Texto:
        PropertyKind: Input
        DisplayName: Texto
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Texto"
    Properties:
      Height: =varTheme.H1+14
      Width: =100
    Children:
      - lblH1:
          Control: Text@0.0.51
          Properties:
            Align: =cmplblh1.AlineaciónHorizontal
            Font: =
            Height: =Parent.Height
            Size: =varTheme.H1
            Text: =cmplblh1.Texto
            VerticalAlign: =VerticalAlign.Middle
            Weight: =varTheme.H1Espesor
            Width: =Parent.Width
