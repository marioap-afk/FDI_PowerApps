ComponentDefinitions:
  cmpbtnBodySec:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      DisplayMode:
        PropertyKind: Input
        DisplayName: DisplayMode
        Description: Propiedad personalizada
        DataType: Text
        Default: =DisplayMode.Edit
      OnSelect:
        PropertyKind: Event
        DisplayName: OnSelect
        Description: Propiedad personalizada
        ReturnType: None
        Default: =
      Text:
        PropertyKind: Input
        DisplayName: Text
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Botón Body"
    Properties:
      Height: =40
      Width: =140
    Children:
      - btnBodySec:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(161, 159, 157, 1)
            DisabledFill: =RGBA(242, 242, 241, 0)
            DisplayMode: =Parent.DisplayMode
            Fill: =ColorValue(varTheme.SecundarioHex)
            FocusedBorderThickness: |
              =2
            Font: =Font.'Segoe UI'
            Height: =Parent.Height-Self.BorderThickness*2
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Self.Fill,-0.2)
            OnSelect: =Parent.OnSelect()
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =RGBA(0, 69, 120, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =ColorFade(Self.Fill,-0.4)
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: |
              =5
            Size: =varTheme.Body
            Text: =Parent.Text
            Width: =Parent.Width-Self.BorderThickness*2
            X: =Self.BorderThickness
            Y: =Self.BorderThickness
