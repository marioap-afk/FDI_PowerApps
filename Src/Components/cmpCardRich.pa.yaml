ComponentDefinitions:
  cmpCardRich:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      DefaultValue:
        PropertyKind: Input
        DisplayName: DefaultValue
        Description: Valor que tendrá el dropdown
        DataType: Text
        Default: |
          =//Coalesce(LookUp(colSEL_Draft; SistemaId = locTabSel.SistemaId; AltCritMonta); "" )
      OnChange:
        PropertyKind: Event
        DisplayName: OnChange
        Description: Aquí se hace el patch
        ReturnType: None
        Default: |-
          =//Patch( colSEL_Draft; LookUp(colSEL_Draft; SistemaId = locTabSel.SistemaId); {AltCritMonta: Self.Value} )
      Título:
        PropertyKind: Input
        DisplayName: Título
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Título"
      Value:
        PropertyKind: Output
        DisplayName: Value
        Description: Propiedad a actualizar en la colección
        DataType: Text
    Properties:
      Height: =200
      Value: =RichCardRich.HtmlText
    Children:
      - cntCardRich:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =5
            PaddingLeft: =5
            PaddingRight: =5
            PaddingTop: =5
            Width: =Parent.Width
          Children:
            - lblCardRich:
                Control: ModernText@1.0.0
                Properties:
                  FontWeight: =varTheme.BodyEspesor
                  Height: =Self.Size*1.5
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =varTheme.Body
                  Text: =cmpCardRich.Título
            - RichCardRich:
                Control: RichTextEditor@2.7.0
                Properties:
                  AccessibleLabel: ="Rich Card Rich"
                  BorderColor: =RGBA(245, 245, 245, 1)
                  Default: =cmpCardRich.DefaultValue
                  FillPortions: =1
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
