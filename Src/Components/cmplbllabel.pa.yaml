ComponentDefinitions:
  cmplbllabel:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      AlineaciónHorizontal:
        PropertyKind: Input
        DisplayName: Alineación horizontal
        Description: Utilizar Align.Left, Align.Center o Align.Right
        DataType: Text
        Default: =Align.Left
      Texto:
        PropertyKind: Input
        DisplayName: Texto
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Texto"
    Properties:
      Height: =varTheme.Label+14
      Width: =100
    Children:
      - lbllabel:
          Control: Text@0.0.51
          Properties:
            Align: =cmplbllabel.AlineaciónHorizontal
            Font: =
            Height: =Parent.Height
            Size: =varTheme.Label
            Text: =cmplbllabel.Texto
            VerticalAlign: =VerticalAlign.Middle
            Weight: =varTheme.LabelEspesor
            Width: =Parent.Width
