            - cmplblh3Asunto:
                Control: CanvasComponent
                ComponentName: cmplblh3
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AlineaciónHorizontal: =Align.Left
                  Height: =30
                  Texto: ="Asunto:"
                  Width: =100
            - TextInput1:
                Control: ModernTextInput@1.1.0
                Properties:
                  AccessibleLabel: ="Text Input"
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =Appearance.FilledLighter
                  Default: ="Solicitud de cotización " & varCotizacionFinal.Folio
                  Height: =44
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
            - cmplblh3Mensaje:
                Control: CanvasComponent
                ComponentName: cmplblh3
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AlineaciónHorizontal: =Align.Left
                  Height: =30
                  Texto: ="Mensaje:"
                  Width: =100
            - HtmlEditor1:
                Control: CodeComponent
                ComponentName: fdi_FDI.HtmlEditor
                Properties:
                  DefaultHtml: =varCuerpoDefault
                  Height: =If(scrCorreo.Size = ScreenSize.Small, Max(320, Min(460, App.Height * 0.45)), Max(360, Min(560, App.Height * 0.5)))
            - cntBotonesCorreo:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingLeft: =If(scrCorreo.Size = ScreenSize.Small, 8, 20)
                  PaddingRight: =If(scrCorreo.Size = ScreenSize.Small, 8, 20)
                Children:
                  - cmpbtnBodySecVolver:
                      Control: CanvasComponent
                      ComponentName: cmpbtnBodySec
                      Properties:
                        DisplayMode: =DisplayMode.Edit
                        Height: =40
                        OnSelect: |-
                          =UpdateContext({locEnviandoCorreo: false});
                          Navigate(scrInicio, ScreenTransition.None)
                        Text: =If(locEnviandoCorreo, "Salir", "Volver")
                        Width: =If(scrCorreo.Size = ScreenSize.Small, Max(104, (Parent.Width - 28) / 2), 128)
                  - cmpbtnBodyEnviar:
                      Control: CanvasComponent
                      ComponentName: cmpbtnBody
                      Properties:
                        DisplayMode: =If(locEnviandoCorreo, DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =40
                        OnSelect: |-
                          =If(
                              locEnviandoCorreo,
                              Notify(
                                  "El correo ya se está enviando. Espera un momento.",
                                  NotificationType.Information
                              ),
                              UpdateContext(
                                  {
                                      locemailDestinatario: Concat(Destinatario, Mail & ";"),
                                      locemailCC: Concat(CC, Mail & ";"),
                                      locCuerpoHtml: Coalesce(HtmlEditor1.HtmlText, varCuerpoDefault)
                                  }
                              );
                              If(
                                  IsBlank(locemailDestinatario) || IsBlank(Trim(TextInput1.Text)) || IsBlank(Trim(locCuerpoHtml)),
                                  Notify(
                                      "Completa destinatario, asunto y cuerpo del correo antes de enviar.",
                                      NotificationType.Error
                                  ),
                                  If(
                                      Confirm(
                                          "¿Enviar la solicitud FDI por correo?",
                                          {
                                              Title: "Enviar correo",
                                              Subtitle: "Esta acción no se puede deshacer",
                                              ConfirmButton: "Enviar",
                                              CancelButton: "Cancelar"
                                          }
                                      ),
                                      UpdateContext({locEnviandoCorreo: true});
                                      IfError(
                                          Set(
                                              varResultadoCorreo,
                                              Correo_Teams_Solicitud_Cotización.Run(
                                                  locemailDestinatario,
                                                  TextInput1.Text,
                                                  locCuerpoHtml,
                                                  locemailCC
                                              )
                                          );
                                          Notify("Solicitud enviada correctamente.", NotificationType.Success);
                                          Set(varCotizacionFinal, Blank());
                                          UpdateContext({locEnviandoCorreo: false});
                                          Navigate(scrInicio, ScreenTransition.None),
                                          Notify(
                                              Coalesce(
                                                  FirstError.Message,
                                                  "No se pudo enviar el correo. Intenta nuevamente."
                                              ),
                                              NotificationType.Error
                                          );
                                          UpdateContext({locEnviandoCorreo: false})
                                      )
                                  )
                              )
                          )
                        Text: =If(locEnviandoCorreo, "Enviando...", "Enviar")
                        Width: =If(scrCorreo.Size = ScreenSize.Small, Max(104, (Parent.Width - 28) / 2), 140)
