                        OnSelect: =Remove(CC, LookUp(CC, UserPrincipalName = ThisItem.UserPrincipalName))
                        PaddingBottom: =9
                        PaddingLeft: =9
                        PaddingRight: =9
                        PaddingTop: =9
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(16, 110, 190, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
