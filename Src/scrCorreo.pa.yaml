                          =Collect(
                              Destinatario,
                              {
                                  DisplayName: TextSearchBox1_2.Text,
                                  UserPrincipalName: TextSearchBox1_2.Text,
                                  Mail: TextSearchBox1_2.Text
                              }
                          );
                          Reset(TextSearchBox1_2)
