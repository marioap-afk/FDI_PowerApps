                          =!IsBlank(TextSearchBox1_2.Text) &&

                          /*Is user entry a valid email address*/
                          IsMatch(TextSearchBox1_2.Text, Match.Email)           &&

                          Not(Trim(TextSearchBox1_2.Text) in Destinatario.UserPrincipalName)
                        Width: =70
                        Y: =10
            - PeopleBrowseGallery1_1:
                Control: Gallery@2.15.0
                Variant: PeoplePickerGallerySmallTablet
