                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(16, 110, 190, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        TabIndex: =0
                        Tooltip: ="Buscar"
                        Width: =TextSearchBox1_2.Height
                        Y: =10
