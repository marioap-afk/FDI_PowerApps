Screens:
  scrCorreo:
    Properties:
      Fill: =ColorValue(varTheme.SuperficieHex)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnHidden: |-
        =UpdateContext({locEnviandoCorreo: false})
      OnVisible: |-
        =UpdateContext({locEnviandoCorreo: false});
        Set(varCoordinador, LookUp(Cotizadores, Puesto.Value = "Coordinador"));
        Clear(Destinatario);
        Clear(CC);
        If(
            !IsBlank(varCoordinador.Nombre.Email),
            Collect(
                Destinatario,
                With(
                    { u: UsuariosdeOffice365.UserProfile(varCoordinador.Nombre.Email) },
                    {
                        DisplayName: Coalesce(u.DisplayName, varCoordinador.Nombre.DisplayName, varCoordinador.Nombre.Email),
                        UserPrincipalName: Coalesce(u.UserPrincipalName, varCoordinador.Nombre.Email),
                        Mail: Coalesce(u.Mail, varCoordinador.Nombre.Email)
                    }
                )
            )
        );
        Collect(
            CC,
            ForAll(
                Filter(
                    Cotizadores,
                    Puesto.Value <> "Coordinador" && !IsBlank(Nombre.Email)
                ),
                With(
                    { u: UsuariosdeOffice365.UserProfile(Nombre.Email) },
                    {
                        DisplayName: Coalesce(u.DisplayName, Nombre.DisplayName, Nombre.Email),
                        UserPrincipalName: Coalesce(u.UserPrincipalName, Nombre.Email),
                        Mail: Coalesce(u.Mail, Nombre.Email)
                    }
                )
            )
        );
        Set(
            varCuerpoDefault,
            "<p>Hola,</p>" &
            "<p>Solicito apoyo para cotizar el FDI <strong>" & Coalesce(varCotizacionFinal.Folio, "") & "</strong>.</p>" &
            "<p><strong>Cliente:</strong> " & Coalesce(varCotizacionFinal.Title, "") & "<br/>" &
            "<strong>Contacto:</strong> " & Coalesce(varCotizacionFinal.'Nombre de contacto', "") & "</p>" &
            "<p>Gracias.</p>"
        );
    Children:
      - cntCorreoMain:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 247, 250, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(scrCorreo.Size = ScreenSize.Small, 12, 24)
            PaddingLeft: =If(scrCorreo.Size = ScreenSize.Small, 12, 32)
            PaddingRight: =If(scrCorreo.Size = ScreenSize.Small, 12, 32)
            PaddingTop: =If(scrCorreo.Size = ScreenSize.Small, 12, 16)
            Width: =Parent.Width
          Children:
            - cmpEncabezadoCorreo:
                Control: CanvasComponent
                ComponentName: cmpEncabezado
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =68
                  Width: =Parent.Width
            - cmplblh3Destinatario:
                Control: CanvasComponent
                ComponentName: cmplblh3
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AlineaciónHorizontal: =Align.Left
                  Height: =30
                  Texto: ="Destinatario:"
                  Width: =100
            - cntDestinatario:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =ColorValue(varTheme.BordeHex)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue(varTheme.SuperficieHex)
                  FillPortions: =0
                  Height: =56
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                Children:
                  - TextSearchBox1_2:
                      Control: Classic/TextInput@2.3.2
                      Group: grpDestinatario_2
                      Properties:
                        AccessibleLabel: ="Busque personas o agregue direcciones de correo electrónico. Se necesita al menos un destinatario para un envío correcto."
                        BorderColor: =RGBA(255, 255, 255, 1)
                        Color: =ColorValue(varTheme.TextoHex)
                        Default: =""
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Font: =Font.'Segoe UI'
                        HintText: ="Buscar personas o agregar una dirección de correo electrónico"
                        HoverBorderColor: =ColorValue(varTheme.PrimarioHex)
                        HoverColor: =ColorValue(varTheme.TextoHex)
                        HoverFill: =ColorValue(varTheme.SuperficieHex)
                        PaddingLeft: =50
                        PressedBorderColor: =ColorValue(varTheme.PrimarioHex)
                        PressedColor: =ColorValue(varTheme.TextoHex)
                        PressedFill: =ColorValue(varTheme.SuperficieHex)
                        RadiusBottomLeft: =varTheme.ControlRadius
                        RadiusBottomRight: =varTheme.ControlRadius
                        RadiusTopLeft: =varTheme.ControlRadius
                        RadiusTopRight: =varTheme.ControlRadius
                        Width: =Parent.Width - Self.X * 2
                        X: =8
                        Y: =8
                  - SearchIcon1_2:
                      Control: Classic/Icon@2.5.0
                      Group: grpDestinatario_2
                      Properties:
                        AccessibleLabel: ="Buscar"
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(0, 120, 212, 1)
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =Self.Width
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(16, 110, 190, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Icon: =Icon.Search
