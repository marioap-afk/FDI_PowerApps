                        Color: =RGBA(255, 255, 255, 1)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =EmailPeopleGallery1_2.TemplateHeight
                        PaddingLeft: =10
                        TabIndex: =If(PeopleBrowseGallery1_2.Visible, -1, 0)
                        Text: =ThisItem.DisplayName
                        Width: =EmailPeopleGallery1_2.TemplateWidth - iconRemove1_2.Width + 10
                        Wrap: =false
                        X: =iconRemove1_2.Width
                  - iconRemove1_2:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: =iconRemove1_2.Tooltip
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =Title4_2.Color
                        DisabledBorderColor: =RGBA(245, 245, 245, 1)
                        DisabledColor: =RGBA(225, 223, 221, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Height: =EmailPeopleGallery1_2.TemplateHeight
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(16, 110, 190, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
