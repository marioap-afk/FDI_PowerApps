                    =/*Only use Office 365 Users operation if user has started searching*/
                    If(!IsBlank(Trim(TextSearchBox1_2.Text)), UsuariosdeOffice365.SearchUser({searchTerm: Trim(TextSearchBox1_2.Text), top: 15}))
